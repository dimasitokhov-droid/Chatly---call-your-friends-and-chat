<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17142b"><title>Chatly — мессенджер</title>
<style>
:root{--bg:#0f1020;--panel:#191a30;--panel2:#22243d;--text:#f5f4ff;--muted:#a6a8c6;--accent:#8871ff;--accent2:#5c49d8;--line:#30324e;--bubble:#282a46}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#342866 0,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:stretch}.app{width:100%;max-width:1000px;min-height:100vh;display:grid;grid-template-columns:330px 1fr;background:rgba(17,18,35,.88);border-left:1px solid #292944;border-right:1px solid #292944}.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 14px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#a995ff,#6045e8);display:grid;place-items:center;font-size:22px;box-shadow:0 7px 25px #6d51ef55}.brand h1{font-size:22px;margin:0;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:1.5px}.search{margin:8px 14px 13px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:0 12px}.search input{width:100%;background:transparent;border:0;outline:0;color:var(--text);padding:12px 0;font:inherit}.section{padding:3px 18px 9px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.4px}.chats{overflow:auto}.contact{width:100%;border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:11px;padding:12px 14px;text-align:left;cursor:pointer}.contact:hover,.contact.active{background:#292646}.avatar{flex:none;width:45px;height:45px;border-radius:16px;display:grid;place-items:center;font-weight:750;font-size:16px;color:#fff;background:linear-gradient(145deg,#8173dc,#4842a0)}.avatar.green{background:linear-gradient(145deg,#3cc6a0,#287b91)}.avatar.orange{background:linear-gradient(145deg,#ffb06c,#c55b76)}.avatar.blue{background:linear-gradient(145deg,#66b8ff,#5260c9)}.contact-info{min-width:0;flex:1}.contact-top{display:flex;justify-content:space-between;gap:8px}.contact-name{font-size:14px;font-weight:700}.time{font-size:10px;color:var(--muted);white-space:nowrap}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{font-size:10px;background:var(--accent);padding:2px 6px;border-radius:20px;color:white}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:12px 15px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.main{display:flex;flex-direction:column;min-width:0;min-height:100vh}.topbar{display:flex;align-items:center;gap:11px;padding:15px 19px;border-bottom:1px solid var(--line);background:#191a2cbb}.topbar .avatar{width:40px;height:40px}.person{flex:1}.person strong{font-size:14px}.online{font-size:11px;color:#70dfbd;margin-top:3px}.top-actions{display:flex;gap:7px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:11px;width:37px;height:37px;cursor:pointer;font-size:17px}.iconbtn:hover{color:white;border-color:var(--accent)}.messages{padding:20px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:13px;background:radial-gradient(ellipse at 50% 35%,#25204455,transparent 65%)}.day{text-align:center;font-size:10px;color:var(--muted);letter-spacing:1px;margin:2px 0 6px}.msg{max-width:78%;display:flex;flex-direction:column;gap:5px;align-self:flex-start}.msg.mine{align-self:flex-end;align-items:flex-end}.bubble{padding:11px 13px;border-radius:16px 16px 16px 5px;background:var(--bubble);font-size:14px;line-height:1.45;overflow-wrap:anywhere;box-shadow:0 5px 15px #00000010}.mine .bubble{background:linear-gradient(135deg,#7764ed,#5745c7);border-radius:16px 16px 5px 16px}.stamp{font-size:10px;color:var(--muted);padding:0 3px}.composer{display:flex;gap:9px;align-items:center;padding:13px 15px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#191a2c}.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:14px;color:var(--text);padding:13px 14px;font:inherit;outline:none}.composer input:focus{border-color:var(--accent)}.send{border:0;border-radius:13px;width:47px;height:47px;background:linear-gradient(145deg,#9b87ff,#654be8);color:white;font-size:20px;cursor:pointer;box-shadow:0 6px 20px #6d51ef33}.hint{text-align:center;font-size:10px;color:var(--muted);padding:0 12px 10px}.empty{margin:auto;text-align:center;color:var(--muted);padding:30px}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}.mobile-back{display:none}
@media(max-width:650px){.app{display:block;min-height:100dvh;border:0}.sidebar{min-height:100dvh;border:0}.main{display:none;min-height:100dvh;height:100dvh}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.mobile-back{display:inline-block}.brand{padding-top:calc(17px + env(safe-area-inset-top))}.topbar{padding-top:calc(12px + env(safe-area-inset-top))}.messages{padding:17px 13px}.msg{max-width:88%}.sidefoot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}
</style></head>
<body><div class="app" id="app"><aside class="sidebar"><div class="brand"><div class="logo">●</div><div><h1>Chatly</h1><small>ТВОЁ ПРОСТРАНСТВО</small></div></div><label class="search"><span>⌕</span><input id="search" placeholder="Поиск чатов…" autocomplete="off"></label><div class="section">СООБЩЕНИЯ</div><div class="chats" id="chatList"></div><div class="sidefoot"><span class="avatar" style="width:32px;height:32px;border-radius:11px;font-size:12px">Я</span><div style="flex:1"><strong style="color:var(--text)">Мой профиль</strong><div>Демо-режим</div></div><span>⚙</span></div></aside><main class="main"><header class="topbar"><button class="iconbtn mobile-back" id="back" aria-label="Назад">‹</button><div id="headAvatar" class="avatar">А</div><div class="person"><strong id="headName">Аня</strong><div class="online">● Демо-чат</div></div><div class="top-actions"><button class="iconbtn" id="theme" title="Сменить тему">☼</button><button class="iconbtn" id="info" title="Информация">ⓘ</button></div></header><section class="messages" id="messages" aria-live="polite"></section><form class="composer" id="form"><button class="iconbtn" type="button" id="emoji" title="Добавить улыбку">☺</button><input id="messageInput" maxlength="1000" placeholder="Написать сообщение…" autocomplete="off" aria-label="Сообщение"><button class="send" aria-label="Отправить">➤</button></form><div class="hint">Сообщения сохраняются только в этом демо на данном устройстве</div></main></div>
<script>
const people=[{id:'anya',name:'Аня',initial:'А',color:'',time:'12:24',preview:'Привет! Как дела?',msgs:[{text:'Привет! 👋 Как дела?',mine:false,time:'12:21'},{text:'Всё хорошо, спасибо! А у тебя?',mine:true,time:'12:22'},{text:'Тоже отлично 😊 Есть планы на сегодня?',mine:false,time:'12:24'}]},{id:'max',name:'Макс',initial:'М',color:'green',time:'11:50',preview:'Давай встретимся!',msgs:[{text:'Привет! Давно не виделись.',mine:false,time:'11:47'},{text:'Точно! Давай встретимся!',mine:true,time:'11:49'},{text:'Давай встретимся!',mine:false,time:'11:50'}]},{id:'group',name:'Наша компания',initial:'Н',color:'orange',time:'10:32',preview:'Сегодня в 18:00',msgs:[{text:'Ребята, какие планы?',mine:false,time:'10:10'},{text:'Сегодня в 18:00 собираемся? 🎉',mine:false,time:'10:32'}]},{id:'lisa',name:'Лиза',initial:'Л',color:'blue',time:'Вчера',preview:'Отправила тебе фото 📷',msgs:[{text:'Привет! Отправила тебе фото 📷',mine:false,time:'Вчера'}]},{id:'bot',name:'Заметки',initial:'✦',color:'green',time:'Пн',preview:'Твои личные заметки',msgs:[{text:'Это твой личный чат. Здесь можно сохранять идеи и заметки.',mine:false,time:'Пн'}]}];let active='anya';
const $=id=>document.getElementById(id);function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderList(){let q=$('search').value.toLowerCase();$('chatList').innerHTML=people.filter(p=>(p.name+' '+p.preview).toLowerCase().includes(q)).map(p=>`<button class="contact ${p.id===active?'active':''}" data-id="${p.id}"><div class="avatar ${p.color}">${p.initial}</div><div class="contact-info"><div class="contact-top"><span class="contact-name">${escapeHtml(p.name)}</span><span class="time">${p.time}</span></div><div class="preview">${escapeHtml(p.preview)}</div></div></button>`).join('');document.querySelectorAll('.contact').forEach(b=>b.onclick=()=>selectChat(b.dataset.id))}
function renderMessages(){const p=people.find(x=>x.id===active);$('headName').textContent=p.name;$('headAvatar').textContent=p.initial;$('headAvatar').className='avatar '+p.color;$('messages').innerHTML='<div class="day">СЕГОДНЯ</div>'+p.msgs.map(m=>`<div class="msg ${m.mine?'mine':''}"><div class="bubble">${escapeHtml(m.text)}</div><span class="stamp">${m.time}${m.mine?' · ✓':''}</span></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}
function selectChat(id){active=id;renderList();renderMessages();$('app').classList.add('chat-open');$('messageInput').focus()}
$('search').addEventListener('input',renderList);$('back').onclick=()=>$('app').classList.remove('chat-open');$('form').addEventListener('submit',e=>{e.preventDefault();let input=$('messageInput'),text=input.value.trim();if(!text)return;let p=people.find(x=>x.id===active),now=new Date(),time=now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});p.msgs.push({text,mine:true,time});p.time=time;p.preview=text;input.value='';renderMessages();renderList()});$('emoji').onclick=()=>{$('messageInput').value+='😊';$('messageInput').focus()};$('theme').onclick=()=>{let light=document.body.dataset.light==='yes';document.body.dataset.light=light?'no':'yes';if(!light){document.documentElement.style.setProperty('--bg','#f0effa');document.documentElement.style.setProperty('--panel','#fff');document.documentElement.style.setProperty('--panel2','#eeecfa');document.documentElement.style.setProperty('--text','#24213b');document.documentElement.style.setProperty('--muted','#777590');document.documentElement.style.setProperty('--bubble','#e8e5fa');document.documentElement.style.setProperty('--line','#d9d6ed');}else{for(let [k,v] of Object.entries({'--bg':'#0f1020','--panel':'#191a30','--panel2':'#22243d','--text':'#f5f4ff','--muted':'#a6a8c6','--bubble':'#282a46','--line':'#30324e'}))document.documentElement.style.setProperty(k,v)}};$('info').onclick=()=>alert('Chatly — демонстрационный интерфейс. Для настоящих сообщений между разными людьми нужно подключить сервер и авторизацию.');renderList();renderMessages();
</script></body></html>
