
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatly — Чат</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #10111a;
      color: #f7f7fb;
      font-family: Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #191a27;
      border-bottom: 1px solid #303144;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: #7657ed;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #back {
      background: #303144;
    }

    #username {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #status {
      color: #b9b8ca;
      font-size: 12px;
      margin-top: 4px;
    }

    #messages {
      min-height: calc(100dvh - 190px);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 84%;
      padding: 11px 13px;
      border-radius: 16px;
      background: #252638;
      overflow-wrap: anywhere;
      align-self: flex-start;
    }

    .message.mine {
      background: #6548d9;
      align-self: flex-end;
    }

    .sender {
      font-size: 12px;
      font-weight: bold;
      opacity: .8;
      margin-bottom: 6px;
    }

    .message-text {
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .message img {
      display: block;
      max-width: 100%;
      width: auto;
      max-height: 360px;
      object-fit: contain;
      border-radius: 10px;
    }

    .time {
      margin-top: 7px;
      text-align: right;
      font-size: 11px;
      opacity: .7;
    }

    #composer {
      position: sticky;
      bottom: 0;
      background: #191a27;
      border-top: 1px solid #303144;
      padding: 10px;
    }

    .tools {
      display: flex;
      gap: 8px;
      margin-bottom: 9px;
    }

    .tools button {
      flex: 1;
      background: #303144;
    }

    .write-row {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #414258;
      outline: none;
      background: #10111a;
      color: white;
      font-size: 16px;
    }

    #send {
      min-width: 76px;
    }

    #notice {
      padding: 8px 12px;
      color: #ffcc8a;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: #aaa9bd;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>
  <header>
    <button id="back" type="button">←</button>
    <div>
      <div id="username">Загрузка чата…</div>
      <div id="status">Подключение к Firebase</div>
    </div>
  </header>

  <main id="messages">
    <div class="empty">Загрузка сообщений…</div>
  </main>

  <div id="notice" role="status"></div>

  <section id="composer">
    <div class="tools">
      <button id="gallery" type="button">🖼️ Галерея</button>
      <button id="camera" type="button">📷 Камера</button>
    </div>

    <input
      id="galleryInput"
      type="file"
      accept="image/*"
    >

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <form id="messageForm" class="write-row">
      <input
        id="messageInput"
        type="text"
        maxlength="5000"
        placeholder="Напишите сообщение…"
        autocomplete="off"
      >
      <button id="send" type="submit">Отправить</button>
    </form>
  </section>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      runTransaction,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
      authDomain: "chatly-19613.firebaseapp.com",
      projectId: "chatly-19613",
      storageBucket: "chatly-19613.firebasestorage.app",
      messagingSenderId: "1080401916394",
      appId: "1:1080401916394:web:815e66c78ced380b4c8293",
      measurementId: "G-WJ2NPP9T45"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const $ = id => document.getElementById(id);

    const usernameEl = $("username");
    const statusEl = $("status");
    const messagesEl = $("messages");
    const noticeEl = $("notice");
    const inputEl = $("messageInput");
    const sendBtn = $("send");
    const galleryBtn = $("gallery");
    const cameraBtn = $("camera");
    const galleryInput = $("galleryInput");
    const cameraInput = $("cameraInput");

    const targetUid =
      new URLSearchParams(location.search).get("uid");

    let currentUser = null;
    let targetUser = null;
    let chatId = null;
    let stopMessages = null;
    let busy = false;

    function notice(message) {
      noticeEl.textContent = message || "";
    }

    function explainError(error) {
      console.error("Chatly Firebase error:", error);

      const code = error?.code || "";

      const messages = {
        "permission-denied":
          "Firebase отказал в доступе. Проверьте Firestore Rules и Storage Rules.",
        "storage/unauthorized":
          "Нет доступа к фотографиям. Проверьте Storage Rules.",
        "storage/bucket-not-found":
          "Хранилище не найдено. Проверьте Storage в Firebase Console.",
        "storage/unknown":
          "Ошибка загрузки фотографии. Проверьте интернет и настройки Storage.",
        "auth/network-request-failed":
          "Нет подключения к интернету.",
        "not-found":
          "Профиль или документ чата не найден.",
        "unavailable":
          "Firebase временно недоступен. Попробуйте ещё раз."
      };

      notice(messages[code] || (
        "Ошибка: " + code + ". " +
        (error?.message || "Не удалось выполнить действие.")
      ));
    }

    $("back").addEventListener("click", () => {
      location.href = "index.html";
    });

    function showEmpty(message) {
      messagesEl.replaceChildren();

      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = message;

      messagesEl.appendChild(div);
    }

    function formatTime(timestamp) {
      if (!timestamp || typeof timestamp.toDate !== "function") {
        return "";
      }

      return timestamp.toDate().toLocaleString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderMessage(data) {
      const wrap = document.createElement("article");

      wrap.className =
        "message" +
        (data.uid === currentUser.uid ? " mine" : "");

      const sender = document.createElement("div");
      sender.className = "sender";

      sender.textContent =
        data.uid === currentUser.uid
          ? "Вы"
          : (targetUser?.username || "Собеседник");

      wrap.appendChild(sender);

      if (data.type === "image") {
        const img = document.createElement("img");

        img.src = data.imageUrl;
        img.alt = "Фотография";
        img.loading = "lazy";

        img.addEventListener("error", () => {
          img.alt = "Не удалось загрузить фотографию";
        });

        wrap.appendChild(img);
      } else {
        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = data.text || "";

        wrap.appendChild(text);
      }

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = formatTime(data.createdAt);

      wrap.appendChild(time);

      return wrap;
    }

    async function openOrCreateChat() {
      const ids = [currentUser.uid, targetUid].sort();
      chatId = ids.join("__");

      const chatRef = doc(db, "chats", chatId);

      await runTransaction(db, async transaction => {
        const snapshot = await transaction.get(chatRef);

        if (!snapshot.exists()) {
          transaction.set(chatRef, {
            members: ids,
            createdAt: serverTimestamp()
          });
        } else {
          const data = snapshot.data();

          if (
            !Array.isArray(data.members) ||
            !data.members.includes(currentUser.uid) ||
            !data.members.includes(targetUid)
          ) {
            throw new Error(
              "Состав участников существующего чата не совпадает."
            );
          }
        }
      });

      const messagesQuery = query(
        collection(db, "chats", chatId, "messages"),
        orderBy("createdAt", "asc")
      );

      if (stopMessages) stopMessages();

      stopMessages = onSnapshot(
        messagesQuery,
        snapshot => {
          messagesEl.replaceChildren();

          if (snapshot.empty) {
            showEmpty("Пока нет сообщений. Напишите первым!");
            return;
          }

          snapshot.forEach(messageDoc => {
            messagesEl.appendChild(
              renderMessage(messageDoc.data())
            );
          });

          messagesEl.scrollTop = messagesEl.scrollHeight;
        },
        error => {
          explainError(error);
          statusEl.textContent = "Ошибка загрузки сообщений";
        }
      );

      statusEl.textContent = "Чат подключён";
    }

    async function sendText(event) {
      event.preventDefault();

      const text = inputEl.value.trim();

      if (!text || !chatId || busy) return;

      busy = true;
      sendBtn.disabled = true;
      notice("");

      try {
        await addDoc(
          collection(db, "chats", chatId, "messages"),
          {
            type: "text",
            text,
            uid: currentUser.uid,
            createdAt: serverTimestamp()
          }
        );

        inputEl.value = "";
      } catch (error) {
        explainError(error);
      } finally {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    async function sendImage(file) {
      if (!file || !chatId || busy) return;

      if (!file.type.startsWith("image/")) {
        notice("Выберите файл изображения.");
        return;
      }

      if (file.size > 8 * 1024 * 1024) {
        notice("Фото должно быть не больше 8 МБ.");
        return;
      }

      busy = true;
      galleryBtn.disabled = true;
      cameraBtn.disabled = true;
      sendBtn.disabled = true;
      notice("Загрузка фотографии…");

      try {
        const extension =
          (file.name.split(".").pop() || "jpg")
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "")
            .slice(0, 8) || "jpg";

        const fileName =
          Date.now() + "_" +
          Math.random().toString(36).slice(2) +
          "." + extension;

        const imagePath =
          `chats/${chatId}/${currentUser.uid}/${fileName}`;

        const imageRef = ref(storage, imagePath);

        await uploadBytes(imageRef, file, {
          contentType: file.type
        });

        const imageUrl = await getDownloadURL(imageRef);

        await addDoc(
          collection(db, "chats", chatId, "messages"),
          {
            type: "image",
            imageUrl,
            imagePath,
            uid: currentUser.uid,
            createdAt: serverTimestamp()
          }
        );

        notice("Фотография отправлена.");
      } catch (error) {
        explainError(error);
      } finally {
        busy = false;
        galleryBtn.disabled = false;
        cameraBtn.disabled = false;
        sendBtn.disabled = false;
        galleryInput.value = "";
        cameraInput.value = "";
      }
    }

    $("messageForm").addEventListener("submit", sendText);

    galleryBtn.addEventListener("click", () => {
      galleryInput.click();
    });

    cameraBtn.addEventListener("click", () => {
      cameraInput.click();
    });

    galleryInput.addEventListener("change", () => {
      sendImage(galleryInput.files?.[0]);
    });

    cameraInput.addEventListener("change", () => {
      sendImage(cameraInput.files?.[0]);
    });

    onAuthStateChanged(auth, async user => {
      if (stopMessages) {
        stopMessages();
        stopMessages = null;
      }

      currentUser = user;

      if (!user) {
        statusEl.textContent = "Не выполнен вход";
        notice("Войдите в Chatly, чтобы открыть переписку.");
        return;
      }

      if (!targetUid || targetUid === user.uid) {
        notice("Некорректный UID собеседника.");
        statusEl.textContent = "Чат не найден";
        return;
      }

      try {
        statusEl.textContent = "Загрузка профиля…";

        const [ownSnapshot, targetSnapshot] = await Promise.all([
          getDoc(doc(db, "users", user.uid)),
          getDoc(doc(db, "users", targetUid))
        ]);

        if (!ownSnapshot.exists()) {
          throw new Error(
            "Ваш профиль не найден в users/" + user.uid
          );
        }

        if (!targetSnapshot.exists()) {
          throw new Error("Профиль собеседника не найден.");
        }

        targetUser = targetSnapshot.data();

        usernameEl.textContent =
          targetUser.username || "Собеседник";

        await openOrCreateChat();
      } catch (error) {
        explainError(error);
        statusEl.textContent = "Не удалось открыть чат";
      }
    });
  </script>
</body>
</html>
