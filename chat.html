
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatly — Чат</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#10111a;color:#f7f7fb;font-family:Arial,sans-serif}
    header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:14px;background:#191a27;border-bottom:1px solid #303144}
    button{border:0;border-radius:12px;padding:12px;background:#7657ed;color:white;font-size:14px;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}
    #back{background:#303144}
    #username{font-weight:bold;overflow-wrap:anywhere}
    #status{color:#b9b8ca;font-size:12px;margin-top:4px}
    #messages{min-height:calc(100dvh - 260px);padding:16px 12px;display:flex;flex-direction:column;gap:12px}
    .message{max-width:84%;padding:11px 13px;border-radius:16px;background:#252638;overflow-wrap:anywhere;align-self:flex-start}
    .message.mine{background:#6548d9;align-self:flex-end}
    .sender{font-size:12px;font-weight:bold;opacity:.8;margin-bottom:6px}
    .message-text{white-space:pre-wrap;line-height:1.4}
    .message img{display:block;max-width:100%;width:auto;max-height:360px;object-fit:contain;border-radius:10px}
    .time{margin-top:7px;text-align:right;font-size:11px;opacity:.7}
    #composer{position:sticky;bottom:0;background:#191a27;border-top:1px solid #303144;padding:10px;z-index:2}
    .tools{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap}
    .tools button{flex:1;background:#303144;min-width:100px}
    .write-row{display:flex;gap:8px}
    #messageInput{min-width:0;flex:1;padding:12px;border-radius:12px;border:1px solid #414258;outline:none;background:#10111a;color:white;font-size:16px}
    #send{min-width:76px}
    #notice{padding:8px 12px;color:#ffcc8a;font-size:13px;overflow-wrap:anywhere}
    .empty{margin:auto;text-align:center;color:#aaa9bd}
    input[type=file]{display:none}
    #callPanel{display:none;margin:10px;padding:12px;background:#202133;border:1px solid #414258;border-radius:16px}
    #callPanel p{margin:0 0 10px;line-height:1.4}
    #callButtons{display:flex;gap:8px;flex-wrap:wrap}
    #callButtons button{flex:1;min-width:95px}
    #acceptCall{background:#21865b}
    #rejectCall,#hangupCall{background:#c43f55}
    #muteCall{background:#414258}
    #callHint{font-size:12px;color:#c6c4dc;margin-top:9px}
  </style>
</head>
<body>
  <header>
    <button id="back" type="button">←</button>
    <div style="flex:1;min-width:0">
      <div id="username">Загрузка чата…</div>
      <div id="status">Подключение к Firebase</div>
    </div>
    <button id="callButton" type="button">📞 Позвонить</button>
  </header>

  <section id="callPanel" aria-live="polite">
    <p id="callTitle">Голосовой звонок</p>
    <div id="callButtons">
      <button id="acceptCall" type="button" hidden>Ответить</button>
      <button id="rejectCall" type="button" hidden>Отклонить</button>
      <button id="muteCall" type="button" hidden>🔇 Выключить микрофон</button>
      <button id="hangupCall" type="button" hidden>Завершить</button>
    </div>
    <div id="callHint">Для звонка разрешите доступ к микрофону.</div>
    <audio id="remoteAudio" autoplay playsinline></audio>
  </section>

  <main id="messages"><div class="empty">Загрузка сообщений…</div></main>
  <div id="notice" role="status"></div>
  <section id="composer">
    <div class="tools">
      <button id="gallery" type="button">🖼️ Галерея</button>
      <button id="camera" type="button">📷 Камера</button>
    </div>
    <input id="galleryInput" type="file" accept="image/*">
    <input id="cameraInput" type="file" accept="image/*" capture="environment">
    <form id="messageForm" class="write-row">
      <input id="messageInput" type="text" maxlength="5000" placeholder="Напишите сообщение…" autocomplete="off">
      <button id="send" type="submit">Отправить</button>
    </form>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, runTransaction, collection, addDoc,
      query, orderBy, onSnapshot, serverTimestamp, updateDoc, where
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
    import {
      getStorage, ref, uploadBytes, getDownloadURL
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
      authDomain: "chatly-19613.firebaseapp.com",
      projectId: "chatly-19613",
      storageBucket: "chatly-19613.firebasestorage.app",
      messagingSenderId: "1080401916394",
      appId: "1:1080401916394:web:815e66c78ced380b4c8293",
      measurementId: "G-WJ2NPP9T45"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const $ = id => document.getElementById(id);

    const usernameEl=$("username"), statusEl=$("status"), messagesEl=$("messages");
    const noticeEl=$("notice"), inputEl=$("messageInput"), sendBtn=$("send");
    const galleryBtn=$("gallery"), cameraBtn=$("camera");
    const galleryInput=$("galleryInput"), cameraInput=$("cameraInput");
    const callButton=$("callButton"), callPanel=$("callPanel");
    const callTitle=$("callTitle"), callHint=$("callHint");
    const acceptCallBtn=$("acceptCall"), rejectCallBtn=$("rejectCall");
    const muteCallBtn=$("muteCall"), hangupCallBtn=$("hangupCall");
    const remoteAudio=$("remoteAudio");

    const targetUid = new URLSearchParams(location.search).get("uid");
    let currentUser=null, targetUser=null, chatId=null, stopMessages=null, stopIncomingCalls=null;
    let busy=false, activeCallId=null, peer=null, localStream=null, stopCallDoc=null, stopCandidates=null;
    let handlingIncoming=false, muted=false, queuedRemoteCandidates=[];

    function notice(message){noticeEl.textContent=message||""}
    function explainError(error){
      console.error("Chatly error:",error);
      const code=error?.code||"";
      const messages={
        "permission-denied":"Firebase отказал в доступе. Проверьте опубликованные Firestore Rules и Storage Rules.",
        "storage/unauthorized":"Нет доступа к фотографиям. Проверьте Storage Rules.",
        "storage/bucket-not-found":"Хранилище не найдено. Проверьте Storage в Firebase Console.",
        "storage/unknown":"Ошибка загрузки фотографии. Проверьте интернет и настройки Storage.",
        "auth/network-request-failed":"Нет подключения к интернету.",
        "not-found":"Профиль или документ чата не найден.",
        "unavailable":"Firebase временно недоступен. Попробуйте ещё раз."
      };
      notice(messages[code]||("Ошибка: "+code+". "+(error?.message||"Не удалось выполнить действие.")));
    }
    $("back").addEventListener("click",()=>location.href="index.html");

    function showEmpty(message){
      messagesEl.replaceChildren();
      const div=document.createElement("div");div.className="empty";div.textContent=message;
      messagesEl.appendChild(div);
    }
    function formatTime(timestamp){
      if(!timestamp||typeof timestamp.toDate!=="function")return "";
      return timestamp.toDate().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    }
    function renderMessage(data){
      const wrap=document.createElement("article");
      wrap.className="message"+(data.uid===currentUser.uid?" mine":"");
      const sender=document.createElement("div");sender.className="sender";
      sender.textContent=data.uid===currentUser.uid?"Вы":(targetUser?.username||"Собеседник");
      wrap.appendChild(sender);
      if(data.type==="image"){
        const img=document.createElement("img");img.src=data.imageUrl;img.alt="Фотография";img.loading="lazy";
        img.addEventListener("error",()=>{img.alt="Не удалось загрузить фотографию"});wrap.appendChild(img);
      }else{
        const text=document.createElement("div");text.className="message-text";text.textContent=data.text||"";wrap.appendChild(text);
      }
      const time=document.createElement("div");time.className="time";time.textContent=formatTime(data.createdAt);wrap.appendChild(time);
      return wrap;
    }

    async function openOrCreateChat(){
      const ids=[currentUser.uid,targetUid].sort();chatId=ids.join("__");
      const chatRef=doc(db,"chats",chatId);
      await runTransaction(db,async transaction=>{
        const snapshot=await transaction.get(chatRef);
        if(!snapshot.exists()){
          transaction.set(chatRef,{members:ids,createdAt:serverTimestamp()});
        }else{
          const data=snapshot.data();
          if(!Array.isArray(data.members)||!data.members.includes(currentUser.uid)||!data.members.includes(targetUid))
            throw new Error("Состав участников существующего чата не совпадает.");
        }
      });
      const messagesQuery=query(collection(db,"chats",chatId,"messages"),orderBy("createdAt","asc"));
      if(stopMessages)stopMessages();
      stopMessages=onSnapshot(messagesQuery,snapshot=>{
        messagesEl.replaceChildren();
        if(snapshot.empty){showEmpty("Пока нет сообщений. Напишите первым!");return}
        snapshot.forEach(messageDoc=>messagesEl.appendChild(renderMessage(messageDoc.data())));
        messagesEl.scrollTop=messagesEl.scrollHeight;
      },explainError);
      statusEl.textContent="Чат подключён";
    }

    async function sendText(event){
      event.preventDefault();const text=inputEl.value.trim();
      if(!text||!chatId||busy)return;
      busy=true;sendBtn.disabled=true;notice("");
      try{
        await addDoc(collection(db,"chats",chatId,"messages"),{type:"text",text,uid:currentUser.uid,createdAt:serverTimestamp()});
        inputEl.value="";
      }catch(error){explainError(error)}
      finally{busy=false;sendBtn.disabled=false;inputEl.focus()}
    }
    async function sendImage(file){
      if(!file||!chatId||busy)return;
      if(!file.type.startsWith("image/")){notice("Выберите файл изображения.");return}
      if(file.size>8*1024*1024){notice("Фото должно быть не больше 8 МБ.");return}
      busy=true;galleryBtn.disabled=true;cameraBtn.disabled=true;sendBtn.disabled=true;notice("Загрузка фотографии…");
      try{
        const extension=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,8)||"jpg";
        const fileName=Date.now()+"_"+Math.random().toString(36).slice(2)+"."+extension;
        const imagePath=`chats/${chatId}/${currentUser.uid}/${fileName}`;
        const imageRef=ref(storage,imagePath);
        await uploadBytes(imageRef,file,{contentType:file.type});
        const imageUrl=await getDownloadURL(imageRef);
        await addDoc(collection(db,"chats",chatId,"messages"),{type:"image",imageUrl,imagePath,uid:currentUser.uid,createdAt:serverTimestamp()});
        notice("Фотография отправлена.");
      }catch(error){explainError(error)}
      finally{busy=false;galleryBtn.disabled=false;cameraBtn.disabled=false;sendBtn.disabled=false;galleryInput.value="";cameraInput.value=""}
    }
    $("messageForm").addEventListener("submit",sendText);
    galleryBtn.addEventListener("click",()=>galleryInput.click());
    cameraBtn.addEventListener("click",()=>cameraInput.click());
    galleryInput.addEventListener("change",()=>sendImage(galleryInput.files?.[0]));
    cameraInput.addEventListener("change",()=>sendImage(cameraInput.files?.[0]));

    // Голосовые звонки: Firestore используется для сигналинга, звук передаётся напрямую через WebRTC.
    const rtcConfig={
      iceServers:[
        {urls:"stun:stun.l.google.com:19302"},
        {urls:"stun:stun1.l.google.com:19302"}
      ],
      iceCandidatePoolSize:10
    };
    function setCallButtons(mode){
      callPanel.style.display=mode==="hidden"?"none":"block";
      acceptCallBtn.hidden=mode!=="incoming";
      rejectCallBtn.hidden=mode!=="incoming";
      muteCallBtn.hidden=mode!=="active";
      hangupCallBtn.hidden=mode==="hidden";
      callButton.disabled=mode!=="hidden";
    }
    function stopCallListeners(){
      if(stopCallDoc){stopCallDoc();stopCallDoc=null}
      if(stopCandidates){stopCandidates();stopCandidates=null}
    }
    function cleanupPeer(){
      stopCallListeners();
      if(peer){peer.ontrack=null;peer.onicecandidate=null;peer.onconnectionstatechange=null;peer.close();peer=null}
      if(localStream){localStream.getTracks().forEach(track=>track.stop());localStream=null}
      remoteAudio.srcObject=null;
      queuedRemoteCandidates=[];
      muted=false;
      muteCallBtn.textContent="🔇 Выключить микрофон";
    }
    function resetCallUI(message=""){
      cleanupPeer();activeCallId=null;handlingIncoming=false;setCallButtons("hidden");
      callTitle.textContent="Голосовой звонок";callHint.textContent=message||"Для звонка разрешите доступ к микрофону.";
    }
    async function setupPeer(){
      if(!navigator.mediaDevices?.getUserMedia)throw new Error("Браузер не поддерживает микрофон. Откройте Chatly через HTTPS в современном браузере.");
      localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      peer=new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track=>peer.addTrack(track,localStream));
      peer.ontrack=event=>{
        remoteAudio.srcObject=event.streams[0];
        remoteAudio.play().catch(()=>{callHint.textContent="Нажмите на экран и разрешите воспроизведение звука."});
      };
      peer.onconnectionstatechange=()=>{
        if(!peer)return;
        callHint.textContent="Соединение: "+peer.connectionState;
        if(peer.connectionState==="failed")callHint.textContent="Не удалось соединиться. Возможно, этой сети нужен TURN-сервер.";
        if(peer.connectionState==="connected")callHint.textContent="Звонок подключён.";
      };
      return peer;
    }
    async function addIceCandidateSafely(candidateData){
      if(!peer||!candidateData?.candidate)return;
      const candidate=new RTCIceCandidate(candidateData.candidate);
      if(peer.remoteDescription)await peer.addIceCandidate(candidate);
      else queuedRemoteCandidates.push(candidate);
    }
    async function flushCandidates(){
      if(!peer||!peer.remoteDescription)return;
      for(const candidate of queuedRemoteCandidates.splice(0)){
        try{await peer.addIceCandidate(candidate)}catch(error){console.warn("ICE candidate skipped",error)}
      }
    }
    function watchRemoteCandidates(callId,remoteUid){
      if(stopCandidates)stopCandidates();
      const candidatesQuery=query(collection(db,"calls",callId,"candidates"),where("senderUid","==",remoteUid));
      stopCandidates=onSnapshot(candidatesQuery,snapshot=>{
        snapshot.docChanges().forEach(change=>{
          if(change.type==="added")addIceCandidateSafely(change.doc.data()).catch(console.warn);
        });
      },error=>{explainError(error)});
    }
    function publishLocalCandidates(callId){
      peer.onicecandidate=async event=>{
        if(!event.candidate||!currentUser)return;
        try{
          await addDoc(collection(db,"calls",callId,"candidates"),{
            senderUid:currentUser.uid,
            candidate:event.candidate.toJSON(),
            createdAt:serverTimestamp()
          });
        }catch(error){explainError(error)}
      };
    }
    async function startCall(){
      if(!currentUser||!chatId||activeCallId||busy)return;
      callButton.disabled=true;notice("");
      try{
        const callPeer=await setupPeer();
        const offer=await callPeer.createOffer();
        await callPeer.setLocalDescription(offer);
        const callRef=await addDoc(collection(db,"calls"),{
          callerUid:currentUser.uid,calleeUid:targetUid,chatId,
          status:"ringing",offer:{type:offer.type,sdp:offer.sdp},
          createdAt:serverTimestamp()
        });
        activeCallId=callRef.id;handlingIncoming=false;
        publishLocalCandidates(activeCallId);
        watchRemoteCandidates(activeCallId,targetUid);
        setCallButtons("active");
        callTitle.textContent="Звоним: "+(targetUser?.username||"собеседнику");
        callHint.textContent="Ожидаем ответа…";
        stopCallDoc=onSnapshot(callRef,async snapshot=>{
          if(!snapshot.exists()||!peer)return;
          const data=snapshot.data();
          if(data.status==="rejected"||data.status==="ended"){
            resetCallUI(data.status==="rejected"?"Собеседник отклонил звонок.":"Звонок завершён.");return;
          }
          if(data.answer&&peer&&!peer.remoteDescription){
            try{await peer.setRemoteDescription(new RTCSessionDescription(data.answer));await flushCandidates()}
            catch(error){explainError(error)}
          }
        },explainError);
      }catch(error){
        explainError(error);resetCallUI("Не удалось начать звонок.");
      }
    }
    async function acceptCall(){
      if(!activeCallId||!handlingIncoming)return;
      acceptCallBtn.disabled=true;rejectCallBtn.disabled=true;
      try{
        const callRef=doc(db,"calls",activeCallId);const callSnap=await getDoc(callRef);
        if(!callSnap.exists())throw new Error("Звонок уже недоступен.");
        const data=callSnap.data();
        if(data.calleeUid!==currentUser.uid||data.status!=="ringing")throw new Error("Этот звонок уже завершён.");
        await setupPeer();
        await peer.setRemoteDescription(new RTCSessionDescription(data.offer));
        await flushCandidates();
        watchRemoteCandidates(activeCallId,data.callerUid);
        publishLocalCandidates(activeCallId);
        const answer=await peer.createAnswer();await peer.setLocalDescription(answer);
        await updateDoc(callRef,{answer:{type:answer.type,sdp:answer.sdp},status:"accepted"});
        handlingIncoming=false;setCallButtons("active");
        callTitle.textContent="Разговор с "+(targetUser?.username||"собеседником");
        callHint.textContent="Подключаем звук…";
        stopCallDoc=onSnapshot(callRef,snapshot=>{
          if(!snapshot.exists())return;
          const callData=snapshot.data();
          if(callData.status==="ended"||callData.status==="rejected")resetCallUI("Звонок завершён.");
        },explainError);
      }catch(error){explainError(error);resetCallUI("Не удалось ответить на звонок.")}
      finally{acceptCallBtn.disabled=false;rejectCallBtn.disabled=false}
    }
    async function rejectCall(){
      if(!activeCallId)return;
      try{await updateDoc(doc(db,"calls",activeCallId),{status:"rejected"})}
      catch(error){explainError(error)}
      resetCallUI("Звонок отклонён.");
    }
    async function hangupCall(){
      const id=activeCallId;
      if(id){
        try{await updateDoc(doc(db,"calls",id),{status:"ended"})}
        catch(error){console.warn("Could not mark call ended",error)}
      }
      resetCallUI("Звонок завершён.");
    }
    async function watchIncomingCalls(){
      if(stopIncomingCalls){stopIncomingCalls();stopIncomingCalls=null}
      const incomingQuery=query(collection(db,"calls"),where("calleeUid","==",currentUser.uid));
      stopIncomingCalls=onSnapshot(incomingQuery,snapshot=>{
        if(activeCallId||handlingIncoming)return;
        const incoming=snapshot.docs
          .map(item=>({id:item.id,...item.data()}))
          .filter(item=>item.status==="ringing"&&item.callerUid!==currentUser.uid)
          .sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0))[0];
        if(!incoming)return;
        activeCallId=incoming.id;handlingIncoming=true;
        callTitle.textContent="Входящий звонок";
        callHint.textContent="Вам звонит пользователь Chatly.";
        setCallButtons("incoming");
        getDoc(doc(db,"users",incoming.callerUid)).then(profile=>{
          if(profile.exists())callTitle.textContent="Вам звонит "+(profile.data().username||"пользователь");
        }).catch(()=>{});
      },error=>explainError(error));
    }
    callButton.addEventListener("click",startCall);
    acceptCallBtn.addEventListener("click",acceptCall);
    rejectCallBtn.addEventListener("click",rejectCall);
    hangupCallBtn.addEventListener("click",hangupCall);
    muteCallBtn.addEventListener("click",()=>{
      if(!localStream)return;
      muted=!muted;localStream.getAudioTracks().forEach(track=>track.enabled=!muted);
      muteCallBtn.textContent=muted?"🎙️ Включить микрофон":"🔇 Выключить микрофон";
    });

    onAuthStateChanged(auth,async user=>{
      if(stopMessages){stopMessages();stopMessages=null}
      if(stopIncomingCalls){stopIncomingCalls();stopIncomingCalls=null}
      currentUser=user;
      if(!user){
        statusEl.textContent="Не выполнен вход";notice("Войдите в Chatly, чтобы открыть переписку.");return;
      }
      if(!targetUid||targetUid===user.uid){
        notice("Некорректный UID собеседника.");statusEl.textContent="Чат не найден";return;
      }
      try{
        statusEl.textContent="Загрузка профиля…";
        const [ownSnapshot,targetSnapshot]=await Promise.all([
          getDoc(doc(db,"users",user.uid)),getDoc(doc(db,"users",targetUid))
        ]);
        if(!ownSnapshot.exists())throw new Error("Ваш профиль не найден в users/"+user.uid);
        if(!targetSnapshot.exists())throw new Error("Профиль собеседника не найден.");
        targetUser=targetSnapshot.data();usernameEl.textContent=targetUser.username||"Собеседник";
        await openOrCreateChat();
        await watchIncomingCalls();
      }catch(error){explainError(error);statusEl.textContent="Не удалось открыть чат"}
    });

    window.addEventListener("pagehide",()=>{
      if(stopMessages)stopMessages();
      if(stopIncomingCalls)stopIncomingCalls();
      cleanupPeer();
    });
  </script>
</body>
</html>
