
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <title>Переписка — Chatly</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101522;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #1a2233;
      border-bottom: 1px solid #303b55;
    }

    header a { color: #aab7ff; text-decoration: none; }
    #chatName { font-weight: bold; overflow-wrap: anywhere; }

    main {
      width: min(760px, 100%);
      margin: auto;
      padding: 14px;
    }

    #status {
      color: #b7c1d8;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #messages {
      height: calc(100dvh - 170px);
      min-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 0;
    }

    .message {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 14px;
      background: #263149;
      align-self: flex-start;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .mine {
      background: #596df0;
      align-self: flex-end;
    }

    .sender, .time {
      font-size: 11px;
      opacity: .8;
      margin-bottom: 5px;
    }

    .time { margin: 6px 0 0; }

    form { display: flex; gap: 8px; }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 11px;
      border: 1px solid #3a4762;
      background: #1a2233;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px;
      border: 0;
      border-radius: 11px;
      background: #7588ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Мои чаты</a>
    <div id="chatName">Загрузка переписки…</div>
  </header>

  <main>
    <p id="status" role="status">Подключаемся к чату…</p>
    <div id="messages" aria-live="polite"></div>

    <form id="messageForm">
      <input id="messageInput" maxlength="5000"
        placeholder="Напиши сообщение…" autocomplete="off" required>
      <button id="sendBtn" type="submit">Отправить</button>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      runTransaction,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
      authDomain: "chatly-19613.firebaseapp.com",
      projectId: "chatly-19613",
      storageBucket: "chatly-19613.firebasestorage.app",
      messagingSenderId: "1080401916394",
      appId: "1:1080401916394:web:815e66c78ced380b4c8293",
      measurementId: "G-WJ2NPP9T45"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    const targetUid = new URLSearchParams(location.search).get("uid");

    let currentUser = null;
    let chatId = null;
    let targetUsername = "пользователь";
    let stopMessagesListener = null;
    let starting = false;
    let startedForUid = null;

    function showStatus(text) {
      $("status").textContent = text;
    }

    function showError(error) {
      console.error(error);

      if (error.code === "permission-denied") {
        showStatus("Доступ запрещён. Проверь правила Firestore.");
      } else if (error.code === "failed-precondition") {
        showStatus("Firebase требует дополнительную настройку. Проверь ошибку в консоли.");
      } else {
        showStatus("Ошибка: " + (error.message || "не удалось загрузить чат."));
      }
    }

    function formatTime(timestamp) {
      if (!timestamp || typeof timestamp.toDate !== "function") return "";

      return timestamp.toDate().toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderMessages(snapshot) {
      const container = $("messages");
      container.replaceChildren();

      for (const messageDoc of snapshot.docs) {
        const data = messageDoc.data();

        const bubble = document.createElement("div");
        bubble.className = "message" +
          (data.uid === currentUser.uid ? " mine" : "");

        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = data.uid === currentUser.uid
          ? "Ты"
          : "@" + targetUsername;

        const text = document.createElement("div");
        text.textContent = data.text || "";

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = formatTime(data.createdAt);

        bubble.append(sender, text, time);
        container.append(bubble);
      }

      container.scrollTop = container.scrollHeight;
    }

    async function startChat(user) {
      if (starting || startedForUid === user.uid) return;
      starting = true;

      try {
        if (!targetUid) {
          showStatus("Не указан пользователь. Вернись на главную страницу.");
          return;
        }

        if (targetUid === user.uid) {
          showStatus("Нельзя написать самому себе.");
          return;
        }

        const targetDoc = await getDoc(doc(db, "users", targetUid));

        if (!targetDoc.exists()) {
          showStatus("Пользователь не найден.");
          return;
        }

        targetUsername = targetDoc.data().username || "пользователь";
        $("chatName").textContent = "@" + targetUsername;

        const myDoc = await getDoc(doc(db, "users", user.uid));

        if (!myDoc.exists()) {
          showStatus("Твой профиль не найден. Попробуй выйти и войти снова.");
          return;
        }

        const members = [user.uid, targetUid].sort();
        chatId = members[0] + "__" + members[1];

        const chatRef = doc(db, "chats", chatId);

        await runTransaction(db, async transaction => {
          const existing = await transaction.get(chatRef);

          if (!existing.exists()) {
            transaction.set(chatRef, {
              members,
              createdAt: serverTimestamp()
            });
          } else {
            const savedMembers = existing.data().members || [];

            if (
              savedMembers.length !== 2 ||
              !savedMembers.includes(user.uid) ||
              !savedMembers.includes(targetUid)
            ) {
              throw new Error("Не совпадают участники этого чата.");
            }
          }
        });

        if (stopMessagesListener) stopMessagesListener();

        const messagesQuery = query(
          collection(db, "chats", chatId, "messages"),
          orderBy("createdAt", "asc")
        );

        stopMessagesListener = onSnapshot(messagesQuery, snapshot => {
          renderMessages(snapshot);

          showStatus(snapshot.empty
            ? "Здесь пока нет сообщений. Напиши первым!"
            : "");
        }, showError);

        startedForUid = user.uid;
      } catch (error) {
        showError(error);
      } finally {
        starting = false;
      }
    }

    $("messageForm").addEventListener("submit", async event => {
      event.preventDefault();

      const text = $("messageInput").value.trim();

      if (!text || !currentUser || !chatId) return;

      $("sendBtn").disabled = true;

      try {
        await addDoc(collection(db, "chats", chatId, "messages"), {
          text,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });

        $("messageInput").value = "";
        $("messageInput").focus();
      } catch (error) {
        showError(error);
      } finally {
        $("sendBtn").disabled = false;
      }
    });

    onAuthStateChanged(auth, user => {
      currentUser = user;

      if (!user) {
        if (stopMessagesListener) {
          stopMessagesListener();
          stopMessagesListener = null;
        }

        $("messageInput").disabled = true;
        $("sendBtn").disabled = true;
        showStatus("Сначала войди в Chatly.");

        const link = document.createElement("a");
        link.href = "index.html";
        link.textContent = "Перейти ко входу";
        $("status").append(" ", link);
        return;
      }

      $("messageInput").disabled = false;
      $("sendBtn").disabled = false;
      startChat(user);
    });
  </script>
</body>
</html>
