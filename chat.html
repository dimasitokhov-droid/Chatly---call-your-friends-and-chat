
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <title>Переписка — Chatly</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101522;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #1a2233;
      border-bottom: 1px solid #303b55;
    }

    header a {
      color: #aab7ff;
      text-decoration: none;
      white-space: nowrap;
    }

    #chatName {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    main {
      width: min(760px, 100%);
      margin: auto;
      padding: 14px;
    }

    #status {
      color: #b7c1d8;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #messages {
      height: calc(100dvh - 175px);
      min-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 0;
    }

    .message {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 14px;
      background: #263149;
      align-self: flex-start;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .mine {
      background: #596df0;
      align-self: flex-end;
    }

    .sender, .time {
      font-size: 11px;
      opacity: .8;
      margin-bottom: 5px;
    }

    .time { margin: 6px 0 0; }

    form {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 11px;
      border: 1px solid #3a4762;
      background: #1a2233;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px;
      border: 0;
      border-radius: 11px;
      background: #7588ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    @media (max-width: 420px) {
      header { gap: 9px; padding: 13px; }
      main { padding: 10px; }
      form { gap: 6px; }
      form button { padding: 10px; }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">← Мои чаты</a>
    <div id="chatName">Загрузка переписки…</div>
  </header>

  <main>
    <p id="status" role="status" aria-live="polite">
      Подключаемся к чату…
    </p>

    <div id="messages" aria-live="polite"></div>

    <form id="messageForm">
      <input
        id="messageInput"
        maxlength="5000"
        placeholder="Напиши сообщение…"
        autocomplete="off"
        required
        disabled
      >
      <button id="sendBtn" type="submit" disabled>
        Отправить
      </button>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      runTransaction,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
      authDomain: "chatly-19613.firebaseapp.com",
      projectId: "chatly-19613",
      storageBucket: "chatly-19613.firebasestorage.app",
      messagingSenderId: "1080401916394",
      appId: "1:1080401916394:web:815e66c78ced380b4c8293",
      measurementId: "G-WJ2NPP9T45"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    const targetUid = new URLSearchParams(
      location.search
    ).get("uid");

    let currentUser = null;
    let chatId = null;
    let targetUsername = "пользователь";
    let stopMessagesListener = null;
    let startVersion = 0;
    let sendInProgress = false;

    function showStatus(text) {
      $("status").textContent = text;
    }

    function showError(error) {
      console.error("Chatly chat error:", error);

      const code = error?.code || "";

      if (code === "permission-denied") {
        showStatus(
          "Firebase запретил доступ. Проверь Firestore Rules и участников чата."
        );
      } else if (code === "failed-precondition") {
        showStatus(
          "Firebase сообщил о проблеме настройки. Подробности смотри в консоли."
        );
      } else if (code === "unavailable") {
        showStatus("Firebase недоступен. Проверь интернет.");
      } else {
        showStatus(
          "Ошибка: " + (error?.message || "не удалось открыть переписку.")
        );
      }
    }

    function stopMessages() {
      if (stopMessagesListener) {
        stopMessagesListener();
        stopMessagesListener = null;
      }
    }

    function updateSendButton() {
      $("sendBtn").disabled =
        !currentUser || !chatId || sendInProgress;
      $("messageInput").disabled = !currentUser || !chatId;
    }

    function formatTime(timestamp) {
      if (!timestamp || typeof timestamp.toDate !== "function") {
        return "";
      }

      return timestamp.toDate().toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderMessages(snapshot) {
      if (!currentUser) return;

      const container = $("messages");
      container.replaceChildren();

      for (const messageDoc of snapshot.docs) {
        const data = messageDoc.data();

        const bubble = document.createElement("div");
        bubble.className = "message" +
          (data.uid === currentUser.uid ? " mine" : "");

        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent =
          data.uid === currentUser.uid
            ? "Ты"
            : "@" + targetUsername;

        const text = document.createElement("div");
        text.textContent = data.text || "";

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = formatTime(data.createdAt);

        bubble.append(sender, text, time);
        container.append(bubble);
      }

      container.scrollTop = container.scrollHeight;
    }

    async function startChat(user, version) {
      stopMessages();
      chatId = null;
      updateSendButton();
      $("messages").replaceChildren();

      if (!targetUid) {
        showStatus(
          "Не указан UID пользователя. Вернись на главную и нажми «Написать»."
        );
        return;
      }

      if (targetUid === user.uid) {
        showStatus("Нельзя написать самому себе.");
        return;
      }

      showStatus("Проверяем профиль собеседника…");

      try {
        const targetRef = doc(db, "users", targetUid);
        const myRef = doc(db, "users", user.uid);

        const [targetSnapshot, mySnapshot] = await Promise.all([
          getDoc(targetRef),
          getDoc(myRef)
        ]);

        if (version !== startVersion || !auth.currentUser ||
            auth.currentUser.uid !== user.uid) return;

        if (!targetSnapshot.exists()) {
          showStatus("Пользователь не найден или его профиль отсутствует.");
          return;
        }

        if (!mySnapshot.exists()) {
          showStatus(
            "Твой профиль не найден. Проверь документ users/" + user.uid
          );
          return;
        }

        targetUsername =
          targetSnapshot.data().username || "пользователь";

        $("chatName").textContent = "@" + targetUsername;

        // У обоих пользователей будет один и тот же ID чата.
        const members = [user.uid, targetUid].sort();
        const newChatId = members[0] + "__" + members[1];
        const chatRef = doc(db, "chats", newChatId);

        showStatus("Открываем личную переписку…");

        await runTransaction(db, async transaction => {
          const existing = await transaction.get(chatRef);

          if (!existing.exists()) {
            transaction.set(chatRef, {
              members: members,
              createdAt: serverTimestamp()
            });
          } else {
            const savedMembers = existing.data().members;

            if (
              !Array.isArray(savedMembers) ||
              savedMembers.length !== 2 ||
              !savedMembers.includes(user.uid) ||
              !savedMembers.includes(targetUid)
            ) {
              throw new Error(
                "У существующего чата неверный список участников. Chat ID: " +
                newChatId
              );
            }
          }
        });

        if (version !== startVersion || !auth.currentUser ||
            auth.currentUser.uid !== user.uid) return;

        chatId = newChatId;
        updateSendButton();

        const messagesQuery = query(
          collection(db, "chats", chatId, "messages"),
          orderBy("createdAt", "asc")
        );

        stopMessagesListener = onSnapshot(
          messagesQuery,
          snapshot => {
            if (version !== startVersion || !currentUser ||
                currentUser.uid !== user.uid) return;

            renderMessages(snapshot);

            showStatus(
              snapshot.empty
                ? "Сообщений пока нет. Напиши первым!"
                : ""
            );
          },
          error => {
            if (version === startVersion) showError(error);
          }
        );
      } catch (error) {
        if (version === startVersion) showError(error);
      }
    }

    $("messageForm").addEventListener("submit", async event => {
      event.preventDefault();

      const text = $("messageInput").value.trim();

      if (!text || !currentUser || !chatId || sendInProgress) {
        return;
      }

      if (text.length > 5000) {
        showStatus("Сообщение не должно превышать 5000 символов.");
        return;
      }

      const sender = currentUser;
      const activeChatId = chatId;

      sendInProgress = true;
      updateSendButton();

      try {
        await addDoc(
          collection(db, "chats", activeChatId, "messages"),
          {
            text: text,
            uid: sender.uid,
            createdAt: serverTimestamp()
          }
        );

        // Не очищаем новый текст, если пользователь уже сменился.
        if (
          currentUser &&
          currentUser.uid === sender.uid &&
          chatId === activeChatId &&
          $("messageInput").value.trim() === text
        ) {
          $("messageInput").value = "";
        }

        showStatus("");
      } catch (error) {
        showError(error);
      } finally {
        sendInProgress = false;
        updateSendButton();
      }
    });

    onAuthStateChanged(auth, user => {
      startVersion++;
      const version = startVersion;

      stopMessages();
      currentUser = user;
      chatId = null;
      sendInProgress = false;
      $("messages").replaceChildren();
      updateSendButton();

      if (!user) {
        $("chatName").textContent = "Переписка";
        showStatus("Сначала войди в Chatly.");

        const link = document.createElement("a");
        link.href = "index.html";
        link.textContent = "Перейти ко входу";

        $("status").append(" ", link);
        return;
      }

      startChat(user, version);
    });
  </script>
</body>
</html>
