
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101522">
  <title>Личный чат — Chatly</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101522;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #1a2233;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #303b55;
    }

    header a { color: #aab7ff; text-decoration: none; }
    #chatName { font-weight: bold; overflow-wrap: anywhere; }
    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 15px;
    }

    #messages {
      height: calc(100dvh - 190px);
      min-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 0;
    }

    .message {
      max-width: 82%;
      padding: 11px 14px;
      background: #263149;
      border-radius: 14px;
      align-self: flex-start;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.mine {
      background: #596df0;
      align-self: flex-end;
    }

    .sender { font-size: 12px; opacity: .8; margin-bottom: 5px; }
    .messageText { line-height: 1.45; }
    .time { font-size: 11px; opacity: .75; margin-top: 6px; }

    form { display: flex; gap: 8px; }
    input, button {
      border-radius: 11px;
      padding: 13px;
      font-size: 16px;
    }

    input {
      min-width: 0;
      flex: 1;
      background: #1a2233;
      color: white;
      border: 1px solid #3a4762;
    }

    button {
      border: 0;
      background: #7588ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }
    #status { color: #b7c1d8; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Назад</a>
    <div id="chatName">Загрузка чата…</div>
  </header>

  <main>
    <p id="status" role="status">Подключаемся…</p>
    <div id="messages" aria-live="polite"></div>

    <form id="messageForm">
      <input id="messageInput" maxlength="5000"
        placeholder="Напиши сообщение…" autocomplete="off" required>
      <button id="sendBtn" type="submit">Отправить</button>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore, doc, getDoc, setDoc, collection,
      addDoc, query, orderBy, onSnapshot, serverTimestamp,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
      authDomain: "chatly-19613.firebaseapp.com",
      projectId: "chatly-19613",
      storageBucket: "chatly-19613.firebasestorage.app",
      messagingSenderId: "1080401916394",
      appId: "1:1080401916394:web:815e66c78ced380b4c8293",
      measurementId: "G-WJ2NPP9T45"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    const params = new URLSearchParams(location.search);
    const targetUid = params.get("uid");
    let currentUser = null;
    let chatId = null;
    let targetUsername = "Пользователь";
    let stopListening = null;
    let starting = false;

    function status(message) {
      $("status").textContent = message;
    }

    function showError(error) {
      console.error(error);
      if (error.code === "permission-denied") {
        status("Доступ запрещён. Проверь Firestore Rules и структуру данных.");
      } else {
        status("Ошибка: " + (error.message || "не удалось загрузить чат."));
      }
    }

    function formatTime(timestamp) {
      if (!timestamp || typeof timestamp.toDate !== "function") return "";
      return timestamp.toDate().toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderMessages(snapshot) {
      const container = $("messages");
      container.replaceChildren();

      snapshot.forEach(messageDoc => {
        const data = messageDoc.data();
        const bubble = document.createElement("div");
        bubble.className = "message" +
          (data.uid === currentUser.uid ? " mine" : "");

        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = data.uid === currentUser.uid
          ? "Ты"
          : "@" + targetUsername;

        const text = document.createElement("div");
        text.className = "messageText";
        text.textContent = data.text || "";

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = formatTime(data.createdAt);

        bubble.append(sender, text, time);
        container.append(bubble);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function startChat(user) {
      if (starting) return;
      starting = true;

      try {
        if (!targetUid) {
          status("Не указан пользователь. Вернись назад и найди человека.");
          return;
        }

        if (targetUid === user.uid) {
          status("Нельзя открыть чат с самим собой.");
          return;
        }

        const targetProfile = await getDoc(doc(db, "users", targetUid));

        if (!targetProfile.exists()) {
          status("Этот пользователь не найден.");
          return;
        }

        targetUsername = targetProfile.data().username || "Пользователь";
        $("chatName").textContent = "@" + targetUsername;

        const myProfile = await getDoc(doc(db, "users", user.uid));
        if (!myProfile.exists()) {
          status("Твой профиль не найден. Выйди и войди снова.");
          return;
        }

        // ID всегда формируется в одном порядке у обоих участников.
        const members = [user.uid, targetUid].sort();
        chatId = members[0] + "__" + members[1];

        const chatRef = doc(db, "chats", chatId);

        // Транзакция помогает избежать повторного создания чата.
        await runTransaction(db, async transaction => {
          const existing = await transaction.get(chatRef);

          if (!existing.exists()) {
            transaction.set(chatRef, {
              members,
              createdAt: serverTimestamp()
            });
          } else {
            const existingMembers = existing.data().members || [];
            if (!existingMembers.includes(user.uid) ||
                !existingMembers.includes(targetUid)) {
              throw new Error("Участники чата не совпадают.");
            }
          }
        });

        if (stopListening) stopListening();

        const messagesQuery = query(
          collection(db, "chats", chatId, "messages"),
          orderBy("createdAt", "asc")
        );

        stopListening = onSnapshot(messagesQuery, snapshot => {
          renderMessages(snapshot);
          status(snapshot.empty ? "Пока нет сообщений. Напиши первым!" : "");
        }, showError);

      } catch (error) {
        showError(error);
      } finally {
        starting = false;
      }
    }

    $("messageForm").addEventListener("submit", async event => {
      event.preventDefault();

      const text = $("messageInput").value.trim();

      if (!text || !currentUser || !chatId) return;

      $("sendBtn").disabled = true;

      try {
        await addDoc(collection(db, "chats", chatId, "messages"), {
          text,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });

        $("messageInput").value = "";
        $("messageInput").focus();
      } catch (error) {
        showError(error);
      } finally {
        $("sendBtn").disabled = false;
      }
    });

    onAuthStateChanged(auth, user => {
      currentUser = user;

      if (!user) {
        status("Сначала войди в Chatly.");
        const back = document.createElement("a");
        back.href = "index.html";
        back.textContent = " Перейти ко входу";
        $("status").append(back);
        $("messageInput").disabled = true;
        $("sendBtn").disabled = true;
        return;
      }

      $("messageInput").disabled = false;
      $("sendBtn").disabled = false;
      startChat(user);
    });
  </script>
</body>
</html>
