
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatly — Чат</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111a;color:#f7f7fb;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:14px;background:#191a27;border-bottom:1px solid #303144}
button{border:0;border-radius:12px;padding:12px;background:#7657ed;color:white;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}
#back{background:#303144}
#username{font-weight:bold;overflow-wrap:anywhere}
#status{color:#b9b8ca;font-size:12px;margin-top:4px}
#callPanel{padding:12px;background:#191a27;border-bottom:1px solid #303144}
#callPanel[hidden],[hidden]{display:none!important}
#callStatus{font-size:14px;color:#d8d1ff;margin-bottom:10px}
.call-buttons{display:flex;gap:8px;flex-wrap:wrap}
.call-buttons button{flex:1 1 125px}
#answerButton{background:#248a58}
#rejectButton,#hangupButton{background:#b7354b}
#muteButton{background:#303144}
#messages{height:calc(100dvh - 255px);min-height:240px;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.message{max-width:84%;padding:11px 13px;border-radius:16px;background:#252638;overflow-wrap:anywhere;align-self:flex-start}
.message.mine{background:#6548d9;align-self:flex-end}
.sender{font-size:12px;font-weight:bold;opacity:.8;margin-bottom:6px}
.message-text{white-space:pre-wrap;line-height:1.4}
.message img{display:block;max-width:100%;max-height:360px;border-radius:10px;object-fit:contain}
.time{margin-top:7px;text-align:right;font-size:11px;opacity:.7}
#composer{position:sticky;bottom:0;background:#191a27;border-top:1px solid #303144;padding:10px}
.tools{display:flex;gap:8px;margin-bottom:9px}
.tools button{flex:1;background:#303144}
.write-row{display:flex;gap:8px}
#messageInput{min-width:0;flex:1;padding:12px;border-radius:12px;border:1px solid #414258;outline:none;background:#10111a;color:white;font-size:16px}
#send{min-width:76px}
#notice{padding:8px 12px;color:#ffcc8a;font-size:13px;overflow-wrap:anywhere}
.empty{margin:auto;text-align:center;color:#aaa9bd}
input[type=file]{display:none}
</style>
</head>
<body>
<header>
  <button id="back" type="button">←</button>
  <div>
    <div id="username">Загрузка чата…</div>
    <div id="status">Подключение к Firebase</div>
  </div>
</header>

<section id="callPanel" hidden>
  <div id="callStatus">Звонок не активен</div>
  <div class="call-buttons">
    <button id="callButton" type="button">📞 Позвонить</button>
    <button id="answerButton" type="button" hidden>✅ Принять</button>
    <button id="rejectButton" type="button" hidden>❌ Отклонить</button>
    <button id="muteButton" type="button" hidden>🎙️ Выключить микрофон</button>
    <button id="hangupButton" type="button" hidden>🔴 Завершить</button>
  </div>
  <audio id="remoteAudio" autoplay playsinline></audio>
</section>

<main id="messages"><div class="empty">Загрузка сообщений…</div></main>
<div id="notice" role="status"></div>

<section id="composer">
  <div class="tools">
    <button id="gallery" type="button">🖼️ Галерея</button>
    <button id="camera" type="button">📷 Камера</button>
  </div>
  <input id="galleryInput" type="file" accept="image/*">
  <input id="cameraInput" type="file" accept="image/*" capture="environment">
  <form id="messageForm" class="write-row">
    <input id="messageInput" type="text" maxlength="5000" placeholder="Напишите сообщение…" autocomplete="off">
    <button id="send" type="submit">Отправить</button>
  </form>
</section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore,doc,getDoc,runTransaction,collection,addDoc,
  query,orderBy,onSnapshot,serverTimestamp,updateDoc,
  setDoc,where,limit
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

const firebaseConfig={
  apiKey:"AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
  authDomain:"chatly-19613.firebaseapp.com",
  projectId:"chatly-19613",
  storageBucket:"chatly-19613.firebasestorage.app",
  messagingSenderId:"1080401916394",
  appId:"1:1080401916394:web:815e66c78ced380b4c8293",
  measurementId:"G-WJ2NPP9T45"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);
const $=id=>document.getElementById(id);
const targetUid=new URLSearchParams(location.search).get("uid");

let currentUser=null,targetUser=null,chatId=null;
let stopMessages=null,stopIncomingCalls=null,stopActiveCall=null;
let stopRemoteCandidates=null;
let activeCallId=null,peer=null,localStream=null;
let remoteDescriptionSet=false,queuedCandidates=[];
let callDocumentReady=false,pendingLocalCandidates=[];
let busy=false,handlingCall=false,isMuted=false;
let callSessionToken=0;

const rtcConfig={
  iceServers:[{urls:"stun:stun.l.google.com:19302"}]
};

function notice(text){$("notice").textContent=text||""}
function setCallStatus(text){$("callStatus").textContent=text}

function explainError(error){
  console.error("Chatly:",error);
  if(error?.code==="permission-denied"){
    notice("Firebase отказал в доступе. Проверь Firestore Rules и UID участников чата.");
  }else if(error?.code==="storage/unauthorized"){
    notice("Нет доступа к фотографиям. Проверь Firebase Storage Rules.");
  }else if(error?.name==="NotAllowedError"){
    notice("Разреши браузеру использовать микрофон.");
  }else if(error?.name==="NotFoundError"){
    notice("Микрофон не найден на устройстве.");
  }else{
    notice("Ошибка: "+(error?.code||error?.message||"Не удалось выполнить действие."));
  }
}

$("back").addEventListener("click",()=>{
  if(activeCallId) void endCall(false);
  location.href="index.html";
});

function showEmpty(text){
  $("messages").replaceChildren();
  const el=document.createElement("div");
  el.className="empty";
  el.textContent=text;
  $("messages").appendChild(el);
}

function formatTime(ts){
  if(!ts?.toDate)return "";
  return ts.toDate().toLocaleString("ru-RU",{
    day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"
  });
}

function renderMessage(data){
  const wrap=document.createElement("article");
  wrap.className="message"+(data.uid===currentUser.uid?" mine":"");

  const sender=document.createElement("div");
  sender.className="sender";
  sender.textContent=data.uid===currentUser.uid?"Вы":(targetUser?.username||"Собеседник");
  wrap.appendChild(sender);

  if(data.type==="image"&&data.imageUrl){
    const img=document.createElement("img");
    img.src=data.imageUrl;
    img.alt="Фотография";
    img.loading="lazy";
    wrap.appendChild(img);
  }else{
    const text=document.createElement("div");
    text.className="message-text";
    text.textContent=data.text||"";
    wrap.appendChild(text);
  }

  const time=document.createElement("div");
  time.className="time";
  time.textContent=formatTime(data.createdAt);
  wrap.appendChild(time);
  return wrap;
}

async function openOrCreateChat(){
  const ids=[currentUser.uid,targetUid].sort();
  chatId=ids.join("__");
  const chatRef=doc(db,"chats",chatId);

  await runTransaction(db,async tx=>{
    const snap=await tx.get(chatRef);
    if(!snap.exists()){
      tx.set(chatRef,{members:ids,createdAt:serverTimestamp()});
    }else{
      const members=snap.data().members||[];
      if(!members.includes(currentUser.uid)||!members.includes(targetUid)){
        throw new Error("Участники чата не совпадают.");
      }
    }
  });

  if(stopMessages)stopMessages();
  stopMessages=onSnapshot(
    query(collection(db,"chats",chatId,"messages"),orderBy("createdAt","asc")),
    snap=>{
      $("messages").replaceChildren();
      if(snap.empty){
        showEmpty("Пока нет сообщений. Напишите первым!");
        return;
      }
      snap.forEach(d=>$("messages").appendChild(renderMessage(d.data())));
      $("messages").scrollTop=$("messages").scrollHeight;
    },
    explainError
  );
  $("status").textContent="Чат подключён";
}

async function sendText(event){
  event.preventDefault();
  const text=$("messageInput").value.trim();
  if(!text||!chatId||busy||!currentUser)return;

  busy=true;
  $("send").disabled=true;
  try{
    await addDoc(collection(db,"chats",chatId,"messages"),{
      type:"text",
      text,
      uid:currentUser.uid,
      createdAt:serverTimestamp()
    });
    $("messageInput").value="";
    notice("");
  }catch(e){
    explainError(e);
  }finally{
    busy=false;
    $("send").disabled=false;
  }
}

async function sendImage(file){
  if(!file||!chatId||busy)return;
  if(!file.type.startsWith("image/")){
    notice("Выбери изображение.");
    return;
  }
  if(file.size>8*1024*1024){
    notice("Фото должно быть не больше 8 МБ.");
    return;
  }

  busy=true;
  notice("Загружаем фотографию…");
  try{
    const name=Date.now()+"_"+Math.random().toString(36).slice(2);
    const path=`chats/${chatId}/${currentUser.uid}/${name}`;
    const imageRef=ref(storage,path);
    await uploadBytes(imageRef,file,{contentType:file.type});
    const url=await getDownloadURL(imageRef);

    await addDoc(collection(db,"chats",chatId,"messages"),{
      type:"image",
      imageUrl:url,
      imagePath:path,
      uid:currentUser.uid,
      createdAt:serverTimestamp()
    });
    notice("Фотография отправлена.");
  }catch(e){
    explainError(e);
  }finally{
    busy=false;
    $("galleryInput").value="";
    $("cameraInput").value="";
  }
}

$("messageForm").addEventListener("submit",sendText);
$("gallery").addEventListener("click",()=>$("galleryInput").click());
$("camera").addEventListener("click",()=>$("cameraInput").click());
$("galleryInput").addEventListener("change",()=>sendImage($("galleryInput").files?.[0]));
$("cameraInput").addEventListener("change",()=>sendImage($("cameraInput").files?.[0]));

function showCallControls({
  call=true,answer=false,reject=false,mute=false,hangup=false
}={}){
  $("callPanel").hidden=false;
  $("callButton").hidden=!call;
  $("answerButton").hidden=!answer;
  $("rejectButton").hidden=!reject;
  $("muteButton").hidden=!mute;
  $("hangupButton").hidden=!hangup;
}

async function getMicrophone(){
  if(!navigator.mediaDevices?.getUserMedia){
    throw new Error("Микрофон недоступен. Открой сайт через HTTPS.");
  }
  return navigator.mediaDevices.getUserMedia({audio:true,video:false});
}

function closePeer(){
  if(stopRemoteCandidates){
    stopRemoteCandidates();
    stopRemoteCandidates=null;
  }
  if(peer){
    peer.ontrack=null;
    peer.onicecandidate=null;
    peer.onconnectionstatechange=null;
    peer.close();
    peer=null;
  }
  if(localStream){
    localStream.getTracks().forEach(track=>track.stop());
    localStream=null;
  }
  $("remoteAudio").srcObject=null;
  remoteDescriptionSet=false;
  queuedCandidates=[];
  callDocumentReady=false;
  pendingLocalCandidates=[];
  isMuted=false;
  $("muteButton").textContent="🎙️ Выключить микрофон";
}

async function addRemoteCandidate(data){
  if(!peer||!data?.candidate)return;
  try{
    const candidate=new RTCIceCandidate(data.candidate);
    if(remoteDescriptionSet){
      await peer.addIceCandidate(candidate);
    }else{
      queuedCandidates.push(candidate);
    }
  }catch(e){
    console.warn("ICE candidate",e);
  }
}

async function flushRemoteCandidates(){
  remoteDescriptionSet=true;
  const pending=queuedCandidates.splice(0);
  for(const candidate of pending){
    try{
      if(peer)await peer.addIceCandidate(candidate);
    }catch(e){
      console.warn("Не удалось добавить ICE-кандидат:",e);
    }
  }
}

async function flushLocalCandidates(callId){
  callDocumentReady=true;
  const pending=pendingLocalCandidates.splice(0);

  for(const candidate of pending){
    await addDoc(
      collection(db,"calls",callId,"candidates"),
      candidate
    );
  }
}

function watchRemoteCandidates(callId,remoteUid){
  if(stopRemoteCandidates)stopRemoteCandidates();

  stopRemoteCandidates=onSnapshot(
    query(
      collection(db,"calls",callId,"candidates"),
      where("senderUid","==",remoteUid)
    ),
    snap=>{
      snap.docChanges().forEach(change=>{
        if(change.type==="added"){
          void addRemoteCandidate(change.doc.data());
        }
      });
    },
    explainError
  );
}

function preparePeer(callId,remoteUid){
  peer=new RTCPeerConnection(rtcConfig);
  callDocumentReady=false;
  pendingLocalCandidates=[];

  peer.ontrack=event=>{
    if(event.streams?.[0]){
      $("remoteAudio").srcObject=event.streams[0];
    }
    $("remoteAudio").play().catch(()=>{
      notice("Нажми на экран, чтобы включить звук.");
    });
  };

  peer.onicecandidate=async event=>{
    if(!event.candidate)return;

    const data={
      senderUid:currentUser.uid,
      candidate:event.candidate.toJSON(),
      createdAt:serverTimestamp()
    };

    if(!callDocumentReady){
      pendingLocalCandidates.push(data);
      return;
    }

    try{
      await addDoc(collection(db,"calls",callId,"candidates"),data);
    }catch(e){
      console.error("Ошибка отправки ICE-кандидата:",e);
      explainError(e);
    }
  };

  peer.onconnectionstatechange=()=>{
    if(!peer)return;
    if(peer.connectionState==="connected"){
      setCallStatus("Разговор начался");
    }else if(peer.connectionState==="disconnected"){
      setCallStatus("Соединение потеряно. Ожидаем…");
    }else if(peer.connectionState==="failed"){
      setCallStatus("Не удалось соединить устройства. Может понадобиться TURN-сервер.");
    }
  };

  watchRemoteCandidates(callId,remoteUid);
}

async function startCall(){
  if(!currentUser||!targetUid||!chatId||activeCallId||handlingCall)return;

  handlingCall=true;
  $("callButton").disabled=true;
  notice("");
  let savedCallId=null;
  const session=++callSessionToken;

  try{
    const chatSnap=await getDoc(doc(db,"chats",chatId));
    if(!chatSnap.exists())throw new Error("Чат не найден.");

    const members=chatSnap.data().members||[];
    if(!members.includes(currentUser.uid)||!members.includes(targetUid)){
      throw new Error("Участники не имеют доступа к этому чату.");
    }

    localStream=await getMicrophone();

    const callRef=doc(collection(db,"calls"));
    activeCallId=callRef.id;
    savedCallId=callRef.id;

    preparePeer(callRef.id,targetUid);
    localStream.getTracks().forEach(track=>peer.addTrack(track,localStream));

    setCallStatus("Подготавливаем звонок…");
    const offer=await peer.createOffer();
    await peer.setLocalDescription(offer);

    await setDoc(callRef,{
      callerUid:currentUser.uid,
      calleeUid:targetUid,
      chatId,
      status:"ringing",
      offer:{
        type:peer.localDescription.type,
        sdp:peer.localDescription.sdp
      },
      createdAt:serverTimestamp()
    });

    await flushLocalCandidates(callRef.id);

    showCallControls({call:false,hangup:true});
    setCallStatus("Вызов… ожидаем ответа");
    watchCallStatus(callRef.id);
  }catch(e){
    explainError(e);

    if(savedCallId){
      try{
        const callRef=doc(db,"calls",savedCallId);
        const snap=await getDoc(callRef);
        if(snap.exists()&&snap.data().status==="ringing"){
          await updateDoc(callRef,{status:"ended"});
        }
      }catch(cleanupError){
        console.warn("Не удалось завершить вызов после ошибки:",cleanupError);
      }
    }

    await cleanupCall(false);
  }finally{
    if(session===callSessionToken){
      handlingCall=false;
      $("callButton").disabled=false;
    }
  }
}

function watchCallStatus(callId){
  if(stopActiveCall)stopActiveCall();

  stopActiveCall=onSnapshot(
    doc(db,"calls",callId),
    async snap=>{
      if(!snap.exists()){
        if(activeCallId===callId)await cleanupCall(false);
        return;
      }

      const data=snap.data();
      if(activeCallId!==callId)return;

      if(data.status==="accepted"&&data.answer&&peer&&!peer.currentRemoteDescription){
        try{
          await peer.setRemoteDescription(new RTCSessionDescription(data.answer));
          await flushRemoteCandidates();
          setCallStatus("Соединяем…");
        }catch(e){
          explainError(e);
        }
      }else if(data.status==="rejected"){
        setCallStatus("Вызов отклонён");
        await cleanupCall(false);
      }else if(data.status==="ended"){
        setCallStatus("Звонок завершён");
        await cleanupCall(false);
      }
    },
    explainError
  );
}

async function answerCall(){
  if(!activeCallId||handlingCall)return;

  handlingCall=true;
  $("answerButton").disabled=true;
  const callId=activeCallId;
  const session=++callSessionToken;

  try{
    const callRef=doc(db,"calls",callId);
    const snap=await getDoc(callRef);
    if(!snap.exists())throw new Error("Вызов уже завершён.");

    const data=snap.data();
    if(data.calleeUid!==currentUser.uid||data.status!=="ringing"){
      throw new Error("Этот вызов больше нельзя принять.");
    }

    localStream=await getMicrophone();
    preparePeer(callId,data.callerUid);
    localStream.getTracks().forEach(track=>peer.addTrack(track,localStream));

    await peer.setRemoteDescription(new RTCSessionDescription(data.offer));
    await flushRemoteCandidates();

    const answer=await peer.createAnswer();
    await peer.setLocalDescription(answer);

    await updateDoc(callRef,{
      answer:{
        type:peer.localDescription.type,
        sdp:peer.localDescription.sdp
      },
      status:"accepted",
      acceptedAt:serverTimestamp()
    });

    await flushLocalCandidates(callId);

    showCallControls({call:false,mute:true,hangup:true});
    setCallStatus("Соединяем…");
    watchCallStatus(callId);
  }catch(e){
    explainError(e);
    await cleanupCall(false);
  }finally{
    if(session===callSessionToken){
      handlingCall=false;
      $("answerButton").disabled=false;
    }
  }
}

async function endCall(rejected=false){
  const callId=activeCallId;
  if(!callId){
    await cleanupCall(true);
    return;
  }

  const session=++callSessionToken;
  try{
    const callRef=doc(db,"calls",callId);
    const snap=await getDoc(callRef);

    if(snap.exists()){
      const data=snap.data();
      const isCaller=data.callerUid===currentUser?.uid;
      const isCallee=data.calleeUid===currentUser?.uid;

      if(!isCaller&&!isCallee){
        throw new Error("Ты не являешься участником этого звонка.");
      }

      if(rejected){
        if(isCallee&&data.status==="ringing"){
          await updateDoc(callRef,{status:"rejected"});
        }
      }else if(["ringing","accepted"].includes(data.status)){
        await updateDoc(callRef,{status:"ended"});
      }
    }
  }catch(e){
    explainError(e);
  }finally{
    if(session===callSessionToken)await cleanupCall(true);
  }
}

async function cleanupCall(reset=true){
  callSessionToken++;
  if(stopActiveCall){
    stopActiveCall();
    stopActiveCall=null;
  }
  closePeer();
  activeCallId=null;
  handlingCall=false;
  showCallControls({call:true});
  $("answerButton").disabled=false;
  $("callButton").disabled=false;
  if(reset)setCallStatus("Звонок завершён");
}

$("callButton").addEventListener("click",startCall);
$("answerButton").addEventListener("click",answerCall);
$("rejectButton").addEventListener("click",()=>endCall(true));
$("hangupButton").addEventListener("click",()=>endCall(false));

$("muteButton").addEventListener("click",()=>{
  if(!localStream)return;
  isMuted=!isMuted;
  localStream.getAudioTracks().forEach(track=>track.enabled=!isMuted);
  $("muteButton").textContent=isMuted
    ?"🔇 Включить микрофон"
    :"🎙️ Выключить микрофон";
});

function listenIncomingCalls(){
  if(stopIncomingCalls)stopIncomingCalls();

  stopIncomingCalls=onSnapshot(
    query(
      collection(db,"calls"),
      where("calleeUid","==",currentUser.uid),
      where("status","==","ringing"),
      limit(10)
    ),
    snap=>{
      snap.docChanges().forEach(change=>{
        if(change.type!=="added")return;

        const call=change.doc.data();
        if(call.callerUid===currentUser.uid)return;

        // На этой странице показываем вызов только от текущего собеседника.
        if(call.chatId!==chatId)return;
        if(activeCallId)return;

        activeCallId=change.doc.id;
        showCallControls({call:false,answer:true,reject:true});
        setCallStatus("Входящий вызов от "+(targetUser?.username||"собеседника"));
        watchCallStatus(activeCallId);
      });
    },
    explainError
  );
}

onAuthStateChanged(auth,async user=>{
  if(stopMessages){stopMessages();stopMessages=null}
  if(stopIncomingCalls){stopIncomingCalls();stopIncomingCalls=null}
  if(stopActiveCall){stopActiveCall();stopActiveCall=null}

  closePeer();
  currentUser=user;
  targetUser=null;
  chatId=null;
  activeCallId=null;
  handlingCall=false;
  showCallControls({call:true});

  if(!user){
    $("status").textContent="Не выполнен вход";
    $("username").textContent="Chatly";
    showEmpty("Войди в Chatly через страницу входа.");
    notice("Войди в Chatly через страницу входа.");
    return;
  }

  if(!targetUid||targetUid===user.uid){
    $("status").textContent="Чат не найден";
    notice("Некорректный UID собеседника в адресе страницы.");
    return;
  }

  try{
    $("status").textContent="Загружаем профиль…";
    const [own,target]=await Promise.all([
      getDoc(doc(db,"users",user.uid)),
      getDoc(doc(db,"users",targetUid))
    ]);

    if(!own.exists())throw new Error("Твой профиль не найден в users.");
    if(!target.exists())throw new Error("Профиль собеседника не найден.");

    targetUser=target.data();
    $("username").textContent="@"+(targetUser.username||"собеседник");

    await openOrCreateChat();
    listenIncomingCalls();
    notice("");
  }catch(e){
    $("status").textContent="Ошибка загрузки";
    explainError(e);
  }
});
</script>
</body>
</html>
