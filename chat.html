
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <title>Переписка — Chatly</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101522;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #1a2233;
      border-bottom: 1px solid #303b55;
    }

    header a {
      color: #aab7ff;
      text-decoration: none;
      white-space: nowrap;
    }

    #chatName {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    main {
      width: min(760px, 100%);
      margin: auto;
      padding: 14px;
    }

    #status {
      color: #b7c1d8;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #messages {
      height: calc(100dvh - 235px);
      min-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 0;
    }

    .message {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 14px;
      background: #263149;
      align-self: flex-start;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .mine {
      background: #596df0;
      align-self: flex-end;
    }

    .sender, .time {
      font-size: 11px;
      opacity: .8;
      margin-bottom: 5px;
    }

    .time { margin: 6px 0 0; }

    .photo {
      display: block;
      max-width: 100%;
      width: auto;
      max-height: 420px;
      object-fit: contain;
      border-radius: 9px;
      margin-top: 4px;
      background: #111827;
    }

    .composer {
      position: sticky;
      bottom: 0;
      padding: 10px 0;
      background: #101522;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 11px;
      border: 1px solid #3a4762;
      background: #1a2233;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px;
      border: 0;
      border-radius: 11px;
      background: #7588ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .photoButtons {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .photoButtons button {
      flex: 1;
      background: #303b55;
    }

    #uploadStatus {
      font-size: 13px;
      color: #b7c1d8;
      overflow-wrap: anywhere;
      margin: 4px 0 8px;
    }

    .hidden { display: none !important; }

    @media (max-width: 420px) {
      header { gap: 9px; padding: 13px; }
      main { padding: 10px; }
      form { gap: 6px; }
      form button { padding: 10px; }
      .message { max-width: 92%; }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">← Chatly</a>
    <div id="chatName">Загрузка переписки…</div>
  </header>

  <main>
    <p id="status" role="status" aria-live="polite">
      Подключаемся к чату…
    </p>

    <div id="messages" aria-live="polite"></div>

    <div class="composer">
      <div class="photoButtons">
        <button id="galleryBtn" type="button" disabled>
          🖼️ Галерея
        </button>

        <button id="cameraBtn" type="button" disabled>
          📷 Камера
        </button>
      </div>

      <input
        id="galleryInput"
        class="hidden"
        type="file"
        accept="image/*"
      >

      <input
        id="cameraInput"
        class="hidden"
        type="file"
        accept="image/*"
        capture="environment"
      >

      <p id="uploadStatus" role="status" aria-live="polite"></p>

      <form id="messageForm">
        <input
          id="messageInput"
          type="text"
          maxlength="5000"
          placeholder="Напиши сообщение…"
          autocomplete="off"
          required
          disabled
        >

        <button id="sendBtn" type="submit" disabled>
          Отправить
        </button>
      </form>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      runTransaction,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
      authDomain: "chatly-19613.firebaseapp.com",
      projectId: "chatly-19613",
      storageBucket: "chatly-19613.firebasestorage.app",
      messagingSenderId: "1080401916394",
      appId: "1:1080401916394:web:815e66c78ced380b4c8293",
      measurementId: "G-WJ2NPP9T45"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const $ = id => document.getElementById(id);

    const targetUid = new URLSearchParams(
      location.search
    ).get("uid");

    let currentUser = null;
    let chatId = null;
    let targetUsername = "пользователь";
    let stopMessagesListener = null;
    let startVersion = 0;
    let sendInProgress = false;
    let uploadInProgress = false;

    const MAX_IMAGE_SIZE = 8 * 1024 * 1024;

    function showStatus(text) {
      $("status").textContent = text;
    }

    function showError(error) {
      console.error("Chatly error:", error);

      if (error?.code === "permission-denied") {
        showStatus(
          "Firebase отказал в доступе. Проверь правила Firestore."
        );
      } else if (
        error?.code === "storage/unauthorized"
      ) {
        $("uploadStatus").textContent =
          "Firebase Storage запретил загрузку. Проверь правила Storage.";
      } else if (
        error?.code === "storage/unknown"
      ) {
        $("uploadStatus").textContent =
          "Ошибка Storage. Проверь настройки хранилища и интернет.";
      } else if (error?.code === "unavailable") {
        showStatus("Firebase недоступен. Проверь интернет.");
      } else {
        showStatus(
          "Ошибка: " + (error?.message || "не удалось выполнить действие.")
        );
      }
    }

    function stopMessages() {
      if (stopMessagesListener) {
        stopMessagesListener();
        stopMessagesListener = null;
      }
    }

    function updateControls() {
      const ready = !!currentUser && !!chatId;

      $("messageInput").disabled = !ready || sendInProgress;
      $("sendBtn").disabled = !ready || sendInProgress;
      $("galleryBtn").disabled = !ready || uploadInProgress;
      $("cameraBtn").disabled = !ready || uploadInProgress;
    }

    function formatTime(timestamp) {
      if (!timestamp || typeof timestamp.toDate !== "function") {
        return "";
      }

      return timestamp.toDate().toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderMessages(snapshot) {
      if (!currentUser) return;

      const container = $("messages");
      container.replaceChildren();

      for (const messageDoc of snapshot.docs) {
        const data = messageDoc.data();

        const bubble = document.createElement("div");
        bubble.className = "message" +
          (data.uid === currentUser.uid ? " mine" : "");

        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent =
          data.uid === currentUser.uid
            ? "Ты"
            : "@" + targetUsername;

        bubble.append(sender);

        // Поддерживаем старые текстовые сообщения
        // и новые сообщения с изображениями.
        if (data.type === "image" && data.imageUrl) {
          const image = document.createElement("img");
          image.className = "photo";
          image.src = data.imageUrl;
          image.alt = "Фотография";
          image.loading = "lazy";

          image.addEventListener("error", () => {
            image.alt = "Не удалось загрузить фотографию";
          });

          bubble.append(image);

          if (data.text) {
            const caption = document.createElement("div");
            caption.textContent = data.text;
            bubble.append(caption);
          }
        } else {
          const text = document.createElement("div");
          text.textContent = data.text || "";
          bubble.append(text);
        }

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = formatTime(data.createdAt);
        bubble.append(time);

        container.append(bubble);
      }

      container.scrollTop = container.scrollHeight;
    }

    async function startChat(user, version) {
      stopMessages();
      chatId = null;
      updateControls();
      $("messages").replaceChildren();

      if (!targetUid) {
        showStatus(
          "Не указан UID собеседника. Вернись на главную и нажми «Написать»."
        );
        return;
      }

      if (targetUid === user.uid) {
        showStatus("Нельзя написать самому себе.");
        return;
      }

      showStatus("Проверяем профиль собеседника…");

      try {
        const [targetSnapshot, mySnapshot] = await Promise.all([
          getDoc(doc(db, "users", targetUid)),
          getDoc(doc(db, "users", user.uid))
        ]);

        if (
          version !== startVersion ||
          !auth.currentUser ||
          auth.currentUser.uid !== user.uid
        ) return;

        if (!targetSnapshot.exists()) {
          showStatus("Профиль собеседника не найден.");
          return;
        }

        if (!mySnapshot.exists()) {
          showStatus("Твой профиль не найден в Firestore.");
          return;
        }

        targetUsername =
          targetSnapshot.data().username || "пользователь";

        $("chatName").textContent = "@" + targetUsername;

        const members = [user.uid, targetUid].sort();
        const newChatId = members[0] + "__" + members[1];
        const chatRef = doc(db, "chats", newChatId);

        showStatus("Открываем переписку…");

        await runTransaction(db, async transaction => {
          const existing = await transaction.get(chatRef);

          if (!existing.exists()) {
            transaction.set(chatRef, {
              members,
              createdAt: serverTimestamp()
            });
          } else {
            const savedMembers = existing.data().members;

            if (
              !Array.isArray(savedMembers) ||
              savedMembers.length !== 2 ||
              !savedMembers.includes(user.uid) ||
              !savedMembers.includes(targetUid)
            ) {
              throw new Error(
                "Список участников существующего чата неверен."
              );
            }
          }
        });

        if (
          version !== startVersion ||
          !auth.currentUser ||
          auth.currentUser.uid !== user.uid
        ) return;

        chatId = newChatId;
        updateControls();

        const messagesQuery = query(
          collection(db, "chats", chatId, "messages"),
          orderBy("createdAt", "asc")
        );

        stopMessagesListener = onSnapshot(
          messagesQuery,
          snapshot => {
            if (
              version !== startVersion ||
              !currentUser ||
              currentUser.uid !== user.uid
            ) return;

            renderMessages(snapshot);

            if (snapshot.empty) {
              showStatus("Сообщений пока нет. Напиши первым!");
            } else {
              showStatus("");
            }
          },
          error => {
            if (version === startVersion) showError(error);
          }
        );
      } catch (error) {
        if (version === startVersion) showError(error);
      }
    }

    // Отправка обычного текста.
    $("messageForm").addEventListener("submit", async event => {
      event.preventDefault();

      const text = $("messageInput").value.trim();

      if (
        !text ||
        !currentUser ||
        !chatId ||
        sendInProgress
      ) return;

      const sender = currentUser;
      const activeChatId = chatId;

      sendInProgress = true;
      updateControls();

      try {
        await addDoc(
          collection(db, "chats", activeChatId, "messages"),
          {
            type: "text",
            text,
            uid: sender.uid,
            createdAt: serverTimestamp()
          }
        );

        if (
          currentUser?.uid === sender.uid &&
          chatId === activeChatId &&
          $("messageInput").value.trim() === text
        ) {
          $("messageInput").value = "";
        }

        showStatus("");
      } catch (error) {
        showError(error);
      } finally {
        sendInProgress = false;
        updateControls();
      }
    });

    // Загрузка изображения из галереи или камеры.
    async function sendImage(file) {
      if (!file || !currentUser || !chatId || uploadInProgress) {
        return;
      }

      if (!file.type.startsWith("image/")) {
        $("uploadStatus").textContent =
          "Выбери файл изображения.";
        return;
      }

      if (file.size > MAX_IMAGE_SIZE) {
        $("uploadStatus").textContent =
          "Фотография слишком большая. Максимум 8 МБ.";
        return;
      }

      const sender = currentUser;
      const activeChatId = chatId;

      uploadInProgress = true;
      updateControls();
      $("uploadStatus").textContent = "Загружаем фотографию…";

      try {
        const safeName = file.name
          .replace(/[^a-zA-Z0-9._-]/g, "_")
          .slice(-80) || "photo.jpg";

        const imagePath =
          "chats/" + activeChatId + "/" + sender.uid + "/" +
          Date.now() + "_" + safeName;

        const imageRef = ref(storage, imagePath);

        await uploadBytes(imageRef, file, {
          contentType: file.type
        });

        const imageUrl = await getDownloadURL(imageRef);

        if (
          !auth.currentUser ||
          auth.currentUser.uid !== sender.uid ||
          chatId !== activeChatId
        ) {
          $("uploadStatus").textContent =
            "Фото загружено, но чат изменился. Открой переписку снова.";
          return;
        }

        await addDoc(
          collection(db, "chats", activeChatId, "messages"),
          {
            type: "image",
            imageUrl,
            imagePath,
            uid: sender.uid,
            createdAt: serverTimestamp()
          }
        );

        $("uploadStatus").textContent = "Фотография отправлена!";
      } catch (error) {
        console.error("Ошибка отправки фото:", error);

        if (error?.code === "storage/unauthorized") {
          $("uploadStatus").textContent =
            "Нет доступа к Storage. Проверь правила хранилища.";
        } else if (error?.code === "storage/canceled") {
          $("uploadStatus").textContent = "Загрузка отменена.";
        } else if (error?.code === "permission-denied") {
          $("uploadStatus").textContent =
            "Firestore запретил сохранить сообщение. Нужно обновить правила.";
        } else {
          $("uploadStatus").textContent =
            "Не удалось отправить фото: " +
            (error?.message || "неизвестная ошибка");
        }
      } finally {
        uploadInProgress = false;
        updateControls();
      }
    }

    $("galleryBtn").addEventListener("click", () => {
      $("galleryInput").click();
    });

    $("cameraBtn").addEventListener("click", () => {
      $("cameraInput").click();
    });

    $("galleryInput").addEventListener("change", async event => {
      const file = event.target.files?.[0];
      event.target.value = "";

      if (file) await sendImage(file);
    });

    $("cameraInput").addEventListener("change", async event => {
      const file = event.target.files?.[0];
      event.target.value = "";

      if (file) await sendImage(file);
    });

    onAuthStateChanged(auth, user => {
      startVersion++;
      const version = startVersion;

      stopMessages();
      currentUser = user;
      chatId = null;
      sendInProgress = false;
      uploadInProgress = false;

      $("messages").replaceChildren();
      $("uploadStatus").textContent = "";
      updateControls();

      if (!user) {
        $("chatName").textContent = "Переписка";
        showStatus("Сначала войди в Chatly.");

        const link = document.createElement("a");
        link.href = "index.html";
        link.textContent = "Перейти ко входу";

        $("status").append(" ", link);
        return;
      }

      startChat(user, version);
    });
  </script>
</body>
</html>
