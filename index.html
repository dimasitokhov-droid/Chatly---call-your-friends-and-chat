
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatly — онлайн-чат</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f2fa;
      color: #24233a;
    }
    header {
      padding: 22px;
      color: white;
      background: #6757e8;
    }
    header h1 { margin: 0 0 6px; }
    main {
      max-width: 620px;
      margin: auto;
      padding: 16px;
    }
    #status { color: #686779; font-size: 14px; }
    #messages {
      height: 55vh;
      min-height: 260px;
      overflow-y: auto;
      padding: 14px;
      background: white;
      border-radius: 16px;
    }
    .message {
      margin: 8px 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: #eeeaff;
      overflow-wrap: anywhere;
    }
    .mine { background: #ded8ff; }
    .meta { font-size: 11px; color: #696580; margin-bottom: 5px; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border: 1px solid #d4d1e5;
      border-radius: 12px;
      font-size: 16px;
    }
    button {
      border: 0;
      padding: 12px 16px;
      border-radius: 12px;
      background: #6757e8;
      color: white;
      font-size: 16px;
    }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <header>
    <h1>💬 Chatly</h1>
    <div>Общая онлайн-комната</div>
  </header>

  <main>
    <p id="status">Подключаемся...</p>
    <div id="messages" aria-live="polite"></div>
    <form id="form">
      <input id="text" maxlength="500"
        placeholder="Напиши сообщение..."
        autocomplete="off" required>
      <button id="send" disabled>➤</button>
    </form>
    <p><small>Тестовая общая комната. Не отправляй личные данные.</small></p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getAuth, signInAnonymously
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, query,
      orderBy, limit, onSnapshot, serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
      authDomain: "chatly-19613.firebaseapp.com",
      projectId: "chatly-19613",
      storageBucket: "chatly-19613.firebasestorage.app",
      messagingSenderId: "1080401916394",
      appId: "1:1080401916394:web:815e66c78ced380b4c8293",
      measurementId: "G-WJ2NPP9T45"
    };

    const status = document.getElementById("status");
    const messages = document.getElementById("messages");
    const input = document.getElementById("text");
    const send = document.getElementById("send");
    const form = document.getElementById("form");

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      await signInAnonymously(auth);
      const user = auth.currentUser;
      const messagesRef = collection(db, "rooms", "general", "messages");
      const recentMessages = query(
        messagesRef, orderBy("createdAt", "desc"), limit(100)
      );

      onSnapshot(recentMessages, snapshot => {
        messages.replaceChildren();
        [...snapshot.docs].reverse().forEach(doc => {
          const data = doc.data();
          const bubble = document.createElement("div");
          bubble.className = "message" +
            (data.uid === user.uid ? " mine" : "");

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = data.uid === user.uid ? "Ты" : "Участник";

          const body = document.createElement("div");
          body.textContent = data.text;

          bubble.append(meta, body);
          messages.appendChild(bubble);
        });
        messages.scrollTop = messages.scrollHeight;
        status.textContent = "Онлайн · общая комната";
        send.disabled = false;
      }, error => {
        status.textContent = "Ошибка загрузки сообщений: " + error.message;
      });

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text || text.length > 500) return;

        send.disabled = true;
        try {
          await addDoc(messagesRef, {
            text,
            uid: user.uid,
            createdAt: serverTimestamp()
          });
          input.value = "";
        } catch (error) {
          status.textContent = "Не удалось отправить: " + error.message;
        } finally {
          send.disabled = false;
        }
      });
    } catch (error) {
      status.textContent = "Ошибка подключения: " + error.message;
    }
  </script>
</body>
</html>
