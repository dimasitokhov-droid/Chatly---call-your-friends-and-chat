
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101522">
  <title>Chatly — общайся с друзьями</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101522;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #283147;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo { font-size: 27px; font-weight: bold; color: #8b9cff; }
    main { width: min(600px, 92%); margin: 35px auto; }

    .panel {
      background: #1a2233;
      border: 1px solid #2b3650;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    h1 { font-size: 26px; margin-top: 0; }
    h2 { font-size: 20px; margin-top: 0; }
    p { color: #b7c1d8; line-height: 1.5; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #3a4762;
      background: #111827;
      color: white;
      outline: none;
    }

    input:focus { border-color: #8b9cff; }

    button {
      border: none;
      background: #7588ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .6; cursor: wait; }

    .secondary { background: #303b55; }
    .hidden { display: none !important; }

    .result {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #3a4762;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .result button { width: auto; margin: 0; }
    .muted { color: #aab5cd; font-size: 14px; }
    #status { overflow-wrap: anywhere; }
    a { color: #aab7ff; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Chatly</div>
    <button id="logoutBtn" class="secondary hidden"
      style="width:auto;margin:0">Выйти</button>
  </header>

  <main>
    <section id="authPanel" class="panel">
      <h1>Общайся без границ 💬</h1>
      <p>Создай аккаунт или войди, чтобы писать другим пользователям.</p>

      <div id="registerFields">
        <input id="username" placeholder="Имя пользователя (3–20 символов)"
          maxlength="20" autocomplete="username">
      </div>

      <input id="email" type="email" placeholder="Email"
        autocomplete="email">
      <input id="password" type="password" placeholder="Пароль"
        autocomplete="current-password">

      <button id="loginBtn">Войти</button>
      <button id="registerBtn" class="secondary">Создать аккаунт</button>
      <p id="authStatus" role="status"></p>
    </section>

    <section id="appPanel" class="hidden">
      <div class="panel">
        <h1>Привет, <span id="myUsername"></span>! 👋</h1>
        <p>Найди человека по имени пользователя и сразу напиши ему.</p>
      </div>

      <div class="panel">
        <h2>Поиск пользователей</h2>
        <input id="searchUsername" placeholder="Например, alex_123"
          maxlength="20">
        <button id="searchBtn">Найти</button>
        <div id="searchResult"></div>
        <p id="searchStatus" role="status"></p>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, onAuthStateChanged,
      signOut, updateProfile
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore, doc, getDoc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
      authDomain: "chatly-19613.firebaseapp.com",
      projectId: "chatly-19613",
      storageBucket: "chatly-19613.firebasestorage.app",
      messagingSenderId: "1080401916394",
      appId: "1:1080401916394:web:815e66c78ced380b4c8293",
      measurementId: "G-WJ2NPP9T45"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);

    function showStatus(id, message) {
      $(id).textContent = message;
    }

    function friendlyError(error) {
      const messages = {
        "auth/email-already-in-use": "Этот email уже зарегистрирован.",
        "auth/invalid-email": "Проверь правильность email.",
        "auth/weak-password": "Пароль слишком простой. Используй не менее 6 символов.",
        "auth/invalid-credential": "Неверный email или пароль.",
        "auth/user-not-found": "Аккаунт не найден.",
        "auth/wrong-password": "Неверный пароль.",
        "auth/too-many-requests": "Слишком много попыток. Попробуй позже.",
        "permission-denied": "Firebase запретил действие. Проверь Firestore Rules."
      };
      return messages[error.code] || error.message || "Произошла ошибка.";
    }

    $("loginBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        return showStatus("authStatus", "Введи email и пароль.");
      }

      $("loginBtn").disabled = true;
      showStatus("authStatus", "Выполняется вход…");

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        showStatus("authStatus", friendlyError(error));
      } finally {
        $("loginBtn").disabled = false;
      }
    });

    $("registerBtn").addEventListener("click", async () => {
      const username = $("username").value.trim().toLowerCase();
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        return showStatus("authStatus",
          "Имя: 3–20 символов, только латинские буквы, цифры и _.");
      }

      if (!email || !password) {
        return showStatus("authStatus", "Введи email и пароль.");
      }

      if (password.length < 6) {
        return showStatus("authStatus", "Пароль должен содержать минимум 6 символов.");
      }

      $("registerBtn").disabled = true;
      showStatus("authStatus", "Создаём аккаунт…");

      try {
        const usernameRef = doc(db, "usernames", username);
        const existingUsername = await getDoc(usernameRef);

        if (existingUsername.exists()) {
          return showStatus("authStatus", "Это имя пользователя уже занято.");
        }

        const credential = await createUserWithEmailAndPassword(
          auth, email, password
        );

        const uid = credential.user.uid;

        await setDoc(usernameRef, { uid });

        await setDoc(doc(db, "users", uid), {
          username,
          createdAt: serverTimestamp()
        });

        await updateProfile(credential.user, { displayName: username });

        showStatus("authStatus", "Аккаунт создан!");
      } catch (error) {
        showStatus("authStatus", friendlyError(error));
      } finally {
        $("registerBtn").disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (error) {
        alert(friendlyError(error));
      }
    });

    onAuthStateChanged(auth, async user => {
      $("authPanel").classList.toggle("hidden", !!user);
      $("appPanel").classList.toggle("hidden", !user);
      $("logoutBtn").classList.toggle("hidden", !user);

      if (!user) return;

      try {
        const profile = await getDoc(doc(db, "users", user.uid));

        if (profile.exists()) {
          $("myUsername").textContent = "@" + profile.data().username;
        } else {
          $("myUsername").textContent = user.displayName || "пользователь";
        }
      } catch (error) {
        showStatus("searchStatus", friendlyError(error));
      }
    });

    async function searchUser() {
      const username = $("searchUsername").value.trim().toLowerCase();

      $("searchResult").replaceChildren();
      showStatus("searchStatus", "");

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        return showStatus("searchStatus", "Введи корректное имя пользователя.");
      }

      if (!auth.currentUser) {
        return showStatus("searchStatus", "Сначала войди в аккаунт.");
      }

      showStatus("searchStatus", "Ищем пользователя…");
      $("searchBtn").disabled = true;

      try {
        const usernameDoc = await getDoc(doc(db, "usernames", username));

        if (!usernameDoc.exists()) {
          return showStatus("searchStatus", "Пользователь не найден.");
        }

        const targetUid = usernameDoc.data().uid;

        if (targetUid === auth.currentUser.uid) {
          return showStatus("searchStatus", "Это твой собственный аккаунт.");
        }

        const profileDoc = await getDoc(doc(db, "users", targetUid));

        if (!profileDoc.exists()) {
          return showStatus("searchStatus", "Профиль пока не найден.");
        }

        const profile = profileDoc.data();
        const card = document.createElement("div");
        card.className = "result";

        const name = document.createElement("strong");
        name.textContent = "@" + profile.username;

        const button = document.createElement("button");
        button.textContent = "Написать";
        button.addEventListener("click", () => {
          location.href = "chat.html?uid=" + encodeURIComponent(targetUid);
        });

        card.append(name, button);
        $("searchResult").append(card);
        showStatus("searchStatus", "");
      } catch (error) {
        showStatus("searchStatus", friendlyError(error));
      } finally {
        $("searchBtn").disabled = false;
      }
    }

    $("searchBtn").addEventListener("click", searchUser);
    $("searchUsername").addEventListener("keydown", event => {
      if (event.key === "Enter") searchUser();
    });
  </script>
</body>
</html>
