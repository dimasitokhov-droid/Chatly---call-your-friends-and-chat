
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatly — твой мессенджер</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f2fa;
      color: #24233a;
    }
    header {
      background: #6757e8;
      color: white;
      padding: 22px;
    }
    header h1 { margin: 0 0 6px; }
    main { max-width: 620px; margin: auto; padding: 18px; }
    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px #25204b0c;
    }
    h2 { margin-top: 0; }
    input {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #d9d6eb;
      border-radius: 11px;
      font-size: 16px;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 11px;
      background: #6757e8;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .secondary { background: #e9e6ff; color: #5142c5; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #messages {
      height: 42vh;
      min-height: 230px;
      overflow-y: auto;
      background: #faf9ff;
      border-radius: 12px;
      padding: 12px;
    }
    .message {
      background: #eae6ff;
      padding: 10px;
      margin: 8px 0;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }
    .meta { font-size: 12px; color: #696580; margin-bottom: 5px; }
    .composer { display: flex; gap: 8px; margin-top: 10px; }
    .composer input { flex: 1; min-width: 0; }
    .hint { color: #747187; font-size: 13px; }
    #status { overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<header>
  <h1>💬 Chatly</h1>
  <div>Общайся без границ</div>
</header>

<main>
  <p id="status" role="status">Подключаемся к Chatly...</p>

  <section id="auth" class="card" hidden>
    <h2 id="authTitle">Добро пожаловать!</h2>
    <p id="authHint">Войди или создай аккаунт.</p>
    <form id="authForm">
      <input id="email" type="email" placeholder="Email"
        autocomplete="email" maxlength="254" required>
      <input id="password" type="password" placeholder="Пароль"
        autocomplete="current-password" minlength="6"
        maxlength="128" required>
      <div class="actions">
        <button id="submitAuth" type="submit">Войти</button>
        <button id="toggleAuth" class="secondary" type="button">
          Создать аккаунт
        </button>
      </div>
    </form>
    <p class="hint">
      Используй свой email и придумай надёжный пароль.
    </p>
  </section>

  <section id="profile" class="card" hidden>
    <h2>Твой аккаунт</h2>
    <p id="userEmail"></p>
    <button id="logout" class="secondary">Выйти</button>
  </section>

  <section id="chat" class="card" hidden>
    <h2>🌍 Общая комната</h2>
    <div id="messages" aria-live="polite"></div>
    <form id="messageForm" class="composer">
      <input id="messageText" placeholder="Напиши сообщение..."
        maxlength="500" autocomplete="off" required>
      <button id="send" type="submit">➤</button>
    </form>
    <p class="hint">
      Общая комната: другие вошедшие пользователи могут читать сообщения.
      Не отправляй личные данные.
    </p>
  </section>
</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, signOut
  } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, limit,
    onSnapshot, serverTimestamp
  } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
    authDomain: "chatly-19613.firebaseapp.com",
    projectId: "chatly-19613",
    storageBucket: "chatly-19613.firebasestorage.app",
    messagingSenderId: "1080401916394",
    appId: "1:1080401916394:web:815e66c78ced380b4c8293",
    measurementId: "G-WJ2NPP9T45"
  };

  const $ = id => document.getElementById(id);
  const status = $("status");
  let isRegistering = false;
  let stopMessages = null;
  let currentUser = null;
  let busy = false;

  function showError(error) {
    const messages = {
      "auth/email-already-in-use": "Этот email уже зарегистрирован. Попробуй войти.",
      "auth/invalid-email": "Проверь правильность email.",
      "auth/weak-password": "Пароль слишком простой. Используй не менее 6 символов.",
      "auth/invalid-credential": "Неверный email или пароль.",
      "auth/network-request-failed": "Проблема с интернетом. Попробуй ещё раз.",
      "auth/too-many-requests": "Слишком много попыток. Попробуй позже.",
      "auth/operation-not-allowed": "Включи Email/Password в Firebase Authentication.",
      "permission-denied": "Firebase запретил доступ. Проверь правила Firestore."
    };
    status.textContent =
      messages[error.code] ||
      messages[error.code?.split("/").pop()] ||
      "Ошибка: " + (error.message || "попробуй ещё раз");
  }

  function updateAuthMode() {
    $("authTitle").textContent = isRegistering
      ? "Создай аккаунт 💜" : "С возвращением!";
    $("authHint").textContent = isRegistering
      ? "Зарегистрируйся с помощью email и пароля."
      : "Войди в свой аккаунт Chatly.";
    $("submitAuth").textContent = isRegistering
      ? "Зарегистрироваться" : "Войти";
    $("toggleAuth").textContent = isRegistering
      ? "У меня уже есть аккаунт" : "Создать аккаунт";
    $("password").autocomplete = isRegistering
      ? "new-password" : "current-password";
  }

  $("toggleAuth").addEventListener("click", () => {
    isRegistering = !isRegistering;
    updateAuthMode();
    status.textContent = "";
  });

  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const messagesRef = collection(db, "rooms", "general", "messages");
    const recentMessages = query(
      messagesRef, orderBy("createdAt", "desc"), limit(100)
    );

    $("authForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (busy) return;
      busy = true;
      $("submitAuth").disabled = true;
      status.textContent = isRegistering
        ? "Создаём аккаунт..." : "Входим...";

      try {
        const email = $("email").value.trim();
        const password = $("password").value;

        if (isRegistering) {
          await createUserWithEmailAndPassword(auth, email, password);
          status.textContent = "Аккаунт создан!";
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          status.textContent = "Ты вошёл в Chatly!";
        }
      } catch (error) {
        showError(error);
      } finally {
        busy = false;
        $("submitAuth").disabled = false;
      }
    });

    $("logout").addEventListener("click", async () => {
      try {
        await signOut(auth);
        status.textContent = "Ты вышел из аккаунта.";
      } catch (error) {
        showError(error);
      }
    });

    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (stopMessages) {
        stopMessages();
        stopMessages = null;
      }

      $("auth").hidden = !!user;
      $("profile").hidden = !user;
      $("chat").hidden = !user;

      if (!user) {
        $("userEmail").textContent = "";
        $("messages").replaceChildren();
        $("send").disabled = true;
        status.textContent = "Войди или создай аккаунт.";
        return;
      }

      $("userEmail").textContent = user.email || "Email не указан";
      status.textContent = "Подключаем общую комнату...";

      stopMessages = onSnapshot(recentMessages, snapshot => {
        if (currentUser?.uid !== user.uid) return;
        const fragment = document.createDocumentFragment();

        [...snapshot.docs].reverse().forEach(doc => {
          const data = doc.data();
          const bubble = document.createElement("div");
          bubble.className = "message";

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = data.uid === user.uid
            ? "Ты" : "Участник";

          const text = document.createElement("div");
          text.textContent = data.text || "";
          bubble.append(meta, text);
          fragment.appendChild(bubble);
        });

        $("messages").replaceChildren(fragment);
        $("messages").scrollTop = $("messages").scrollHeight;
        status.textContent = "Chatly онлайн 💜";
        $("send").disabled = false;
      }, error => {
        showError(error);
      });
    });

    $("messageForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (!currentUser || busy) return;

      const text = $("messageText").value.trim();
      if (!text || text.length > 500) return;

      busy = true;
      $("send").disabled = true;
      try {
        await addDoc(messagesRef, {
          text,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });
        $("messageText").value = "";
      } catch (error) {
        showError(error);
      } finally {
        busy = false;
        $("send").disabled = false;
      }
    });

    updateAuthMode();
  } catch (error) {
    showError(error);
  }
</script>
</body>
</html>
