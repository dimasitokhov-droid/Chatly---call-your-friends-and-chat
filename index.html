
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <title>Chatly — чаты и сообщения</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101522;
      color: #f5f7ff;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 5%;
      background: #171f30;
      border-bottom: 1px solid #303b55;
    }

    .logo {
      color: #9aa9ff;
      font-size: 27px;
      font-weight: bold;
    }

    main {
      width: min(650px, 94%);
      margin: 25px auto;
    }

    .panel {
      background: #1a2233;
      border: 1px solid #303b55;
      border-radius: 17px;
      padding: 20px;
      margin-bottom: 18px;
    }

    h1 { font-size: 25px; margin: 0 0 10px; }
    h2 { font-size: 20px; margin: 0 0 10px; }
    p { color: #b7c1d8; line-height: 1.5; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      background: #111827;
      color: white;
      border: 1px solid #3a4762;
      outline: none;
    }

    input:focus { border-color: #8b9cff; }

    button {
      background: #7588ff;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #303b55; }
    .hidden { display: none !important; }

    .muted {
      color: #aab5cd;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #303b55;
    }

    .entry:last-child { border-bottom: 0; }
    .entryInfo { min-width: 0; overflow-wrap: anywhere; }
    .entry button { width: auto; min-width: 95px; margin: 0; }
    #authStatus, #searchStatus, #chatsStatus {
      overflow-wrap: anywhere;
    }

    @media (max-width: 420px) {
      .panel { padding: 15px; }
      .entry { align-items: flex-start; }
      .entry button { min-width: 85px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Chatly 💬</div>
    <button id="logoutBtn" class="secondary hidden"
      style="width:auto;margin:0">Выйти</button>
  </header>

  <main>
    <section id="authPanel" class="panel">
      <h1>Добро пожаловать в Chatly!</h1>
      <p>Войди в аккаунт или создай новый, чтобы общаться.</p>

      <div id="registerFields">
        <input id="username"
          placeholder="Имя пользователя"
          maxlength="20"
          autocomplete="username">
        <p class="muted">
          3–20 символов: латинские буквы, цифры или _.
        </p>
      </div>

      <input id="email" type="email"
        placeholder="Email" autocomplete="email">
      <input id="password" type="password"
        placeholder="Пароль" autocomplete="current-password">

      <button id="loginBtn">Войти</button>
      <button id="registerBtn" class="secondary">
        Создать аккаунт
      </button>
      <p id="authStatus" role="status" aria-live="polite"></p>
    </section>

    <div id="appPanel" class="hidden">
      <section class="panel">
        <h1>Привет, <span id="myUsername"></span>! 👋</h1>
        <p>Ищи пользователей и начинай переписку без заявок в друзья.</p>
      </section>

      <section class="panel">
        <h2>🔎 Найти пользователя</h2>
        <input id="searchUsername"
          placeholder="Имя пользователя" maxlength="20">
        <button id="searchBtn">Найти</button>
        <p id="searchStatus" role="status" aria-live="polite"></p>
        <div id="searchResult"></div>
      </section>

      <section class="panel">
        <h2>💬 Мои чаты</h2>
        <p>Твои личные переписки.</p>
        <div id="myChatsList"></div>
        <p id="chatsStatus" role="status" aria-live="polite">
          Загружаем чаты…
        </p>
      </section>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut,
      updateProfile
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp,
      collection,
      query,
      where,
      onSnapshot,
      runTransaction
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
      authDomain: "chatly-19613.firebaseapp.com",
      projectId: "chatly-19613",
      storageBucket: "chatly-19613.firebasestorage.app",
      messagingSenderId: "1080401916394",
      appId: "1:1080401916394:web:815e66c78ced380b4c8293",
      measurementId: "G-WJ2NPP9T45"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    let stopChatsListener = null;
    let authViewVersion = 0;
    let chatLoadVersion = 0;
    let searchVersion = 0;

    function showError(error) {
      console.error("Chatly error:", error);

      const code = error?.code || "";

      const messages = {
        "auth/email-already-in-use": "Этот email уже используется.",
        "auth/invalid-email": "Проверь правильность email.",
        "auth/weak-password": "Пароль должен содержать минимум 6 символов.",
        "auth/invalid-credential": "Неверный email или пароль.",
        "auth/too-many-requests": "Слишком много попыток. Попробуй позже.",
        "auth/network-request-failed": "Проверь подключение к интернету.",
        "permission-denied":
          "Firebase отказал в доступе. Проверь Firestore Rules.",
        "unavailable": "Firebase недоступен. Проверь интернет.",
        "already-exists": "Это имя пользователя уже занято."
      };

      return messages[code] ||
        error?.message ||
        "Произошла неизвестная ошибка.";
    }

    function stopListeningToChats() {
      chatLoadVersion++;

      if (stopChatsListener) {
        stopChatsListener();
        stopChatsListener = null;
      }
    }

    function openChat(uid) {
      if (!uid || !auth.currentUser) return;

      location.href = "chat.html?uid=" + encodeURIComponent(uid);
    }

    function addUserRow(container, username, uid, subtitle) {
      const row = document.createElement("div");
      row.className = "entry";

      const info = document.createElement("div");
      info.className = "entryInfo";

      const name = document.createElement("strong");
      name.textContent = "@" + username;

      const detail = document.createElement("div");
      detail.className = "muted";
      detail.textContent = subtitle;

      const button = document.createElement("button");
      button.textContent = "Написать";
      button.addEventListener("click", () => openChat(uid));

      info.append(name, detail);
      row.append(info, button);
      container.append(row);
    }

    function normalizeUsername(value) {
      return value.trim().toLowerCase();
    }

    // Вход в существующий аккаунт.
    $("loginBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        $("authStatus").textContent = "Введи email и пароль.";
        return;
      }

      $("loginBtn").disabled = true;
      $("authStatus").textContent = "Входим…";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        $("authStatus").textContent = "";
      } catch (error) {
        $("authStatus").textContent = showError(error);
      } finally {
        $("loginBtn").disabled = false;
      }
    });

    // Регистрация и атомарное резервирование имени в Firestore.
    $("registerBtn").addEventListener("click", async () => {
      const username = normalizeUsername($("username").value);
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        $("authStatus").textContent =
          "Имя: 3–20 символов, латинские буквы, цифры или _.";
        return;
      }

      if (!email || !password) {
        $("authStatus").textContent = "Введи email и пароль.";
        return;
      }

      if (password.length < 6) {
        $("authStatus").textContent =
          "Пароль должен содержать минимум 6 символов.";
        return;
      }

      $("registerBtn").disabled = true;
      let createdUser = null;

      try {
        $("authStatus").textContent = "Создаём аккаунт…";

        const credential = await createUserWithEmailAndPassword(
          auth, email, password
        );

        createdUser = credential.user;

        const usernameRef = doc(db, "usernames", username);
        const userRef = doc(db, "users", createdUser.uid);

        await runTransaction(db, async transaction => {
          const existingName = await transaction.get(usernameRef);

          if (existingName.exists()) {
            throw new Error("USERNAME_TAKEN");
          }

          transaction.set(usernameRef, {
            uid: createdUser.uid
          });

          transaction.set(userRef, {
            username,
            createdAt: serverTimestamp()
          });
        });

        await updateProfile(createdUser, {
          displayName: username
        });

        $("authStatus").textContent = "Аккаунт создан!";
      } catch (error) {
        if (error.message === "USERNAME_TAKEN") {
          $("authStatus").textContent =
            "Это имя уже занято. Выбери другое.";
        } else {
          $("authStatus").textContent =
            "Ошибка регистрации: " + showError(error);

          if (createdUser) {
            $("authStatus").textContent +=
              " Аккаунт мог быть создан без профиля. Не регистрируйся повторно с тем же email; сначала проверь вход и профиль в Firebase.";
          }
        }
      } finally {
        $("registerBtn").disabled = false;
      }
    });

    // Выход.
    $("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (error) {
        alert(showError(error));
      }
    });

    // Поиск пользователя по имени.
    async function searchUser() {
      const version = ++searchVersion;
      const username = normalizeUsername($("searchUsername").value);

      $("searchResult").replaceChildren();
      $("searchStatus").textContent = "";

      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        $("searchStatus").textContent =
          "Введи имя из 3–20 латинских букв, цифр или _.";
        return;
      }

      const currentUser = auth.currentUser;

      if (!currentUser) {
        $("searchStatus").textContent = "Сначала войди в аккаунт.";
        return;
      }

      $("searchBtn").disabled = true;
      $("searchStatus").textContent = "Ищем пользователя…";

      try {
        const usernameSnapshot = await getDoc(
          doc(db, "usernames", username)
        );

        if (version !== searchVersion) return;

        if (!usernameSnapshot.exists()) {
          $("searchStatus").textContent = "Пользователь не найден.";
          return;
        }

        const uid = usernameSnapshot.data().uid;

        if (uid === currentUser.uid) {
          $("searchStatus").textContent =
            "Это твой собственный аккаунт.";
          return;
        }

        const profileSnapshot = await getDoc(doc(db, "users", uid));

        if (version !== searchVersion) return;

        if (!profileSnapshot.exists()) {
          $("searchStatus").textContent =
            "Профиль не найден. Возможно, регистрация не завершилась.";
          return;
        }

        addUserRow(
          $("searchResult"),
          profileSnapshot.data().username || username,
          uid,
          "Личная переписка без заявок в друзья"
        );

        $("searchStatus").textContent = "";
      } catch (error) {
        if (version === searchVersion) {
          $("searchStatus").textContent = showError(error);
        }
      } finally {
        if (version === searchVersion) {
          $("searchBtn").disabled = false;
        }
      }
    }

    $("searchBtn").addEventListener("click", searchUser);

    $("searchUsername").addEventListener("keydown", event => {
      if (event.key === "Enter") searchUser();
    });

    // Подписка на чаты текущего пользователя.
    function loadMyChats(user) {
      stopListeningToChats();

      const version = chatLoadVersion;
      $("myChatsList").replaceChildren();
      $("chatsStatus").textContent = "Загружаем чаты…";

      const chatsQuery = query(
        collection(db, "chats"),
        where("members", "array-contains", user.uid)
      );

      stopChatsListener = onSnapshot(
        chatsQuery,
        async snapshot => {
          if (
            version !== chatLoadVersion ||
            !auth.currentUser ||
            auth.currentUser.uid !== user.uid
          ) return;

          $("myChatsList").replaceChildren();

          if (snapshot.empty) {
            $("chatsStatus").textContent =
              "Пока нет чатов. Найди пользователя и нажми «Написать».";
            return;
          }

          $("chatsStatus").textContent = "Загружаем участников…";

          const chats = snapshot.docs;

          const rows = await Promise.all(chats.map(async chatSnapshot => {
            const members = chatSnapshot.data().members;

            if (!Array.isArray(members)) return null;

            const otherUid = members.find(uid => uid !== user.uid);

            if (!otherUid) return null;

            try {
              const profileSnapshot = await getDoc(
                doc(db, "users", otherUid)
              );

              if (!profileSnapshot.exists()) {
                return {
                  uid: otherUid,
                  username: "пользователь",
                  subtitle: "Профиль не найден"
                };
              }

              return {
                uid: otherUid,
                username: profileSnapshot.data().username || "пользователь",
                subtitle: "Личная переписка"
              };
            } catch (error) {
              console.error("Ошибка загрузки профиля:", error);
              return null;
            }
          }));

          if (
            version !== chatLoadVersion ||
            !auth.currentUser ||
            auth.currentUser.uid !== user.uid
          ) return;

          $("myChatsList").replaceChildren();

          for (const row of rows) {
            if (!row) continue;

            addUserRow(
              $("myChatsList"),
              row.username,
              row.uid,
              row.subtitle
            );
          }

          $("chatsStatus").textContent =
            $("myChatsList").childElementCount
              ? "Твои переписки"
              : "Не удалось загрузить участников чатов.";
        },
        error => {
          if (version !== chatLoadVersion) return;

          console.error("Ошибка списка чатов:", error);
          $("myChatsList").replaceChildren();
          $("chatsStatus").textContent =
            "Не удалось загрузить чаты: " + showError(error);
        }
      );
    }

    // Обновление интерфейса при входе и выходе.
    onAuthStateChanged(auth, async user => {
      const version = ++authViewVersion;

      stopListeningToChats();
      searchVersion++;

      $("authPanel").classList.toggle("hidden", !!user);
      $("appPanel").classList.toggle("hidden", !user);
      $("logoutBtn").classList.toggle("hidden", !user);

      $("searchResult").replaceChildren();
      $("searchStatus").textContent = "";
      $("myChatsList").replaceChildren();

      if (!user) {
        $("myUsername").textContent = "";
        $("chatsStatus").textContent =
          "Войди, чтобы увидеть свои чаты.";
        return;
      }

      $("chatsStatus").textContent = "Загружаем чаты…";

      try {
        const profileSnapshot = await getDoc(
          doc(db, "users", user.uid)
        );

        if (version !== authViewVersion) return;

        if (profileSnapshot.exists()) {
          $("myUsername").textContent =
            profileSnapshot.data().username || user.displayName || "пользователь";
        } else {
          $("myUsername").textContent =
            user.displayName || "пользователь";

          $("chatsStatus").textContent =
            "Профиль не найден. Возможно, регистрация не завершилась.";
          return;
        }

        loadMyChats(user);
      } catch (error) {
        if (version !== authViewVersion) return;

        console.error("Ошибка загрузки профиля:", error);
        $("myUsername").textContent =
          user.displayName || "пользователь";

        $("chatsStatus").textContent =
          "Ошибка загрузки профиля: " + showError(error);
      }
    });
  </script>
</body>
</html>
